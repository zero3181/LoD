<style>
@font-face { font-family: "Pretendard Variable"; font-weight: 45 920; font-style: normal; font-display: swap; src: url("PretendardVariable.woff2") format("woff2-variations"); }
/* Layout: one phone-width column shaped like a personnel record — an ID card header, a running log, and a control strip. */
:root {
  --bg: #e9ecef;
  --surface: #ffffff;
  --sunk: #f4f6f8;
  --ink: #15181c;
  --muted: #5b636d;
  --line: #cfd4da;
  --des: #2541b2;        /* 디자이너: 코발트 잉크 */
  --dev: #1d7350;        /* 개발자 */
  --plan: #9a5f07;       /* 기획자 (NPC) */
  --stamp: #c2352b;      /* 기록부 도장, 한 곳에만 */
  --font-display: "Pretendard Variable", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-body: var(--font-display);
  --font-data: var(--font-display);
  --accent: var(--des);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101316; --surface: #191d22; --sunk: #14171b; --ink: #e5e8eb; --muted: #9aa3ad; --line: #2d333a;
    --des: #8197ff; --dev: #4fc78f; --plan: #e3a640; --stamp: #ff6f61; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101316; --surface: #191d22; --sunk: #14171b; --ink: #e5e8eb; --muted: #9aa3ad; --line: #2d333a;
  --des: #8197ff; --dev: #4fc78f; --plan: #e3a640; --stamp: #ff6f61; color-scheme: dark;
}
html, body { height: 100%; }
body {
  word-break: keep-all; overflow-wrap: anywhere;
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6; letter-spacing: -0.01em; font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.app {
  max-width: 560px; margin: 0 auto; height: 100%; display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
[data-role="developer"] { --accent: var(--dev); }
[data-role="planner"] { --accent: var(--plan); }
h1, h2, h3 { font-family: var(--font-display); font-weight: 800; text-wrap: balance; margin: 0; letter-spacing: -0.03em; }
p { margin: 0; }
.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.label { font-size: 11px; letter-spacing: 0.08em; color: var(--muted); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn {
  border: 1px solid var(--ink); background: var(--ink); color: var(--surface); padding: 12px 18px; border-radius: 4px;
  font-weight: 600; min-height: 44px;
}
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn:disabled { opacity: .4; cursor: default; }
.sublink { margin: 12px 0 0; }
.textlink { background: none; border: 0; padding: 4px 0; font: inherit; font-size: 14px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.textlink:hover { color: var(--ink); }
.scroll { flex: 1; overflow-y: auto; min-height: 0; padding-block: 20px; }

/* ── 시작 화면 ── */
.start { display: flex; flex-direction: column; gap: 28px; }
.start h1 { font-size: clamp(26px, 7.6vw, 40px); line-height: 1.2; white-space: nowrap; }
.start .lede { color: var(--muted); max-width: 34em; }
.form-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 8px 12px; min-height: 40px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); }
.facts div { background: var(--surface); padding: 12px; display: flex; flex-direction: column; gap: 2px; }
.facts b { font-family: var(--font-data); font-weight: 700; font-size: 20px; }
.facts span { font-size: 12px; color: var(--muted); }
.fine { font-size: 12px; color: var(--muted); }
.challenge { font-size: 19px; font-weight: 700; line-height: 1.45; letter-spacing: -0.02em; color: var(--accent); }
.facts .wide { grid-column: 1 / -1; }
details.manual summary { cursor: pointer; color: var(--muted); font-size: 13px; }
details.manual[open] summary { margin-bottom: 10px; }

/* ── 배정 연출 ── */
.waffle { display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; width: 104px; flex: none; }
.wage-rank { display: flex; gap: 14px; align-items: center; }
.people10 { max-width: 320px; }
.ends10 { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 2px; }
.wage-rank .ends { display: flex; flex-direction: column; justify-content: space-between; align-self: stretch; font-size: 11px; color: var(--muted); }
.goalres { margin-top: 10px; font-size: 13px; font-weight: 600; color: var(--muted); }
.goalres.ok { color: var(--accent); }
.newend { font-size: 14px; font-weight: 700; color: var(--accent); margin-bottom: 6px; }
.endings { display: flex; flex-wrap: wrap; gap: 6px; }
.endings span { font-size: 12.5px; padding: 5px 9px; border-radius: 6px; border: 1px dashed var(--line); color: var(--muted); }
.endings span.got { border-style: solid; color: var(--ink); background: var(--surface); }
.endings span.me { border-color: var(--accent); color: var(--accent); font-weight: 700; }
details.more > summary { font-size: 15px; font-weight: 700; cursor: pointer; padding: 10px 0; }
details.more[open] { display: flex; flex-direction: column; gap: 24px; }
.reveal-go { position: sticky; bottom: 0; display: flex; flex-direction: column; gap: 8px; padding: 14px 0 calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--bg); border-top: 1px solid var(--line); margin-top: 8px; }
.reveal-go .goal { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.moodbox summary { font-size: 13px; color: var(--muted); cursor: pointer; padding: 4px 0; }
.moodbox .mood { margin-top: 6px; }
.line.fx { font-size: 12.5px; color: var(--accent); }
.nextfocus .ff { align-self: flex-start; }
.nextfocus { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.nextfocus .q { font-size: 14px; font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { border: 1px solid var(--line); background: var(--sunk); border-radius: 999px; padding: 8px 14px; font-size: 14px; min-height: 40px; }
.chips button:hover { border-color: var(--accent); }
.chips button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: var(--surface); font-weight: 600; }
.waffle .dot.s { background: color-mix(in oklab, var(--accent) 38%, var(--surface)); }
.waffle .dot.m { background: var(--accent); }
.waffle .dot.me { background: var(--accent); outline-width: 1.5px; outline-offset: 1px; }
.steps { display: flex; flex-direction: column; gap: 10px; }
.step { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; font-size: 13px; }
.step b { font-size: 15px; }
.step .bar { grid-column: 1 / -1; height: 10px; background: var(--sunk); border: 1px solid var(--line); border-radius: 5px; overflow: hidden; }
.step .bar i { display: block; height: 100%; background: var(--accent); border-radius: 5px 0 0 5px; min-width: 3px; }
.step.l1 .bar i { background: color-mix(in oklab, var(--accent) 22%, var(--surface)); }
.step.l2 .bar i { background: color-mix(in oklab, var(--accent) 38%, var(--surface)); }
.sizebar { display: flex; height: 26px; border-radius: 5px; overflow: hidden; border: 1px solid var(--line); }
.sizebar span { display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--muted); background: var(--sunk); border-right: 1px solid var(--line); min-width: 0; overflow: hidden; white-space: nowrap; }
.sizebar span:last-child { border-right: 0; }
.sizebar span.on { background: var(--accent); color: var(--surface); font-weight: 700; }
.dots { display: grid; grid-template-columns: repeat(20, 1fr); gap: 4px; max-width: 360px; }
.funnel { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); }
.funnel div { background: var(--surface); padding: 10px; display: flex; flex-direction: column; gap: 2px; }
.funnel b { font-size: 18px; font-weight: 700; }
.funnel span { font-size: 12px; color: var(--muted); line-height: 1.4; }
.dot { aspect-ratio: 1; border-radius: 50%; background: var(--line); }
.dot.d { background: color-mix(in oklab, var(--des) 45%, var(--surface)); }
.dot.v { background: color-mix(in oklab, var(--dev) 45%, var(--surface)); }
.dot.me { outline: 2px solid var(--ink); outline-offset: 2px; background: var(--accent); animation: pop .6s ease-out; }
@keyframes pop { from { transform: scale(2.2); } to { transform: scale(1); } }

/* ── 사원증 헤더 ── */
.scene-wrap { flex: none; margin-top: 8px; }
.scene { display: block; width: 100%; height: auto; image-rendering: pixelated; border-radius: 6px; border: 1px solid var(--line); background: #bfe3f5; }
.scene-cap { font-size: 12px; color: var(--muted); margin-top: 3px; }
.idcard {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; margin-top: 12px;
  background: var(--surface); border: 1px solid var(--line); border-top: 6px solid var(--accent); border-radius: 6px;
  padding: 12px 14px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px;
}
.idcard .who { font-family: var(--font-display); font-size: 19px; font-weight: 700; }
.idcard .where { color: var(--muted); font-size: 13px; }
.idcard .where span { white-space: nowrap; }
.idcard .limit { display: inline-block; margin-top: 6px; padding: 3px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; color: var(--plan); background: color-mix(in srgb, var(--plan) 12%, transparent); }
.idcard .pay { text-align: right; }
.idcard .pay b { font-family: var(--font-data); font-size: 22px; font-weight: 500; }
.meters { grid-column: 1 / -1; display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.meter { display: flex; align-items: center; gap: 6px; }
.meter i { display: block; width: 64px; height: 6px; background: var(--sunk); border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
.meter i::after { content: ""; display: block; height: 100%; width: var(--v); background: var(--accent); }
.meter.low i::after { background: var(--stamp); }

/* ── 기록 피드 ── */
.feed { display: flex; flex-direction: column; gap: 10px; }
.yr { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 10px; }
.yr .y { font-family: var(--font-data); font-size: 12px; color: var(--muted); padding-top: 3px; }
.yr .lines { display: flex; flex-direction: column; gap: 6px; border-left: 1px solid var(--line); padding-left: 12px; min-width: 0; }
.line { font-size: 14px; }
.line.big { font-weight: 600; }
.line.peer { color: var(--muted); font-size: 13px; }
.line.peer::before { content: "동기 · "; font-size: 11px; letter-spacing: .06em; }
.why { display: inline; }
.why summary { display: inline; list-style: none; font-size: 11px; color: var(--accent); cursor: pointer; margin-left: 6px; white-space: nowrap; }
.why summary::-webkit-details-marker { display: none; }
.why[open] .whybody { display: block; }
.evidence { margin: 0; padding: 0 2px; font-size: 12.5px; line-height: 1.6; color: var(--muted); }
.whybody { margin-top: 6px; background: var(--sunk); border: 1px solid var(--line); padding: 8px 10px; font-size: 12px; color: var(--muted); border-radius: 4px; }
.grade { font-family: var(--font-data); font-size: 10px; border: 1px solid currentColor; border-radius: 3px; padding: 0 4px; margin-left: 4px; }

/* ── 조작 막대 ── */
.controls { border-top: 1px solid var(--line); padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; background: var(--bg); }
.focus { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.focus button { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13px; min-height: 36px; }
.focus button[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in oklab, var(--accent) 14%, var(--surface)); font-weight: 600; }
.focus-hint { font-size: 12px; color: var(--muted); min-height: 1.5em; }
.go { display: flex; gap: 8px; }
.autopick { display: flex; align-items: center; gap: 8px; font-size: 13px; min-height: 36px; cursor: pointer; flex-wrap: wrap; }
.autopick input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; }
.autopick .fine { font-size: 11.5px; }
.go .btn:first-child { flex: 1; }

/* ── 카드 (이벤트·체크포인트) ── */
.sheet-wrap { position: fixed; inset: 0; background: color-mix(in oklab, var(--ink) 40%, transparent); display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
.sheet {
  width: 100%; max-width: 560px; max-height: 88%; overflow-y: auto; background: var(--surface); border-radius: 10px 10px 0 0;
  padding: 20px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 14px; animation: rise .25s ease-out;
}
@keyframes rise { from { transform: translateY(24px); opacity: .6; } }
.sheet h2 { font-size: 22px; }
.choices { display: flex; flex-direction: column; gap: 8px; }
.choice { text-align: left; border: 1px solid var(--line); background: var(--sunk); border-radius: 6px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.choice:hover { border-color: var(--accent); }
.choice small { color: var(--muted); font-size: 12px; }
.choice:disabled { opacity: .45; cursor: default; }
.choice[aria-current="true"] { border-color: var(--accent); }
.choice em { font-style: normal; margin-left: 6px; }
.choice.auto { border-color: var(--accent); background: color-mix(in oklab, var(--accent) 10%, var(--sunk)); }
.autobar { height: 4px; background: var(--sunk); border-radius: 2px; overflow: hidden; }
.autobar i { display: block; height: 100%; width: 100%; background: var(--accent); transform-origin: left; animation: autofill linear forwards; }
@keyframes autofill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.autonote { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin-top: -6px; }
.autonote button { border: 1px solid var(--line); background: var(--surface); border-radius: 4px; padding: 4px 10px; font-size: 12px; min-height: 32px; flex: none; }
.cat { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: 0; color: var(--accent); border: 1px solid currentColor; border-radius: 999px; padding: 0 8px; margin-right: 4px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 500; color: var(--muted); font-size: 11px; letter-spacing: .04em; }
td.r, th.r { text-align: right; }
.tw { overflow-x: auto; }
.tag { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 3px; border: 1px solid; }
.tag.designer { color: var(--des); } .tag.developer { color: var(--dev); } .tag.planner { color: var(--plan); } .tag.other { color: var(--muted); }
td:first-child, th:last-child, td.r { white-space: nowrap; }
tr.me td { font-weight: 600; background: color-mix(in oklab, var(--accent) 8%, var(--surface)); }
.mood { display: flex; gap: 8px; }
.mood input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--sunk); border-radius: 4px; padding: 10px; font: inherit; color: var(--ink); }
.bigstat { font-family: var(--font-display); font-size: 17px; line-height: 1.5; }
.bigstat b { font-weight: 700; color: var(--accent); }

/* ── 기록부 ── */
.record { display: flex; flex-direction: column; gap: 28px; }
.record header { display: flex; flex-direction: column; gap: 6px; position: relative; }
.stamp {
  align-self: flex-start; font-family: var(--font-display); color: var(--stamp); border: 2px solid var(--stamp); border-radius: 4px;
  padding: 2px 10px; font-size: 14px; transform: rotate(-3deg); letter-spacing: .1em;
}
.record h2 { font-size: 13px; font-family: var(--font-body); font-weight: 600; letter-spacing: .08em; color: var(--muted); border-bottom: 1px solid var(--line); padding-bottom: 6px; margin-bottom: 10px; }
.map { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 3px; }
.cell { aspect-ratio: 1; border-radius: 2px; position: relative; }
.cell.none { background: repeating-linear-gradient(45deg, var(--line) 0 2px, transparent 2px 5px); border: 1px solid var(--line); }
.cell.switch::after { content: ""; position: absolute; inset: 30%; border-radius: 50%; background: var(--surface); }
.cell.pause { background-image: radial-gradient(var(--muted) 1px, transparent 1.2px) !important; background-size: 4px 4px; border: 1px solid var(--line); }
.cell .mk { position: absolute; right: 2px; bottom: 2px; width: 5px; height: 5px; border-radius: 50%; background: var(--ink); }
.rec-title { font-size: clamp(26px, 7vw, 34px); line-height: 1.2; }
.odds { display: flex; gap: 16px; align-items: center; border: 1px solid var(--line); border-left: 6px solid var(--accent); background: var(--surface); border-radius: 6px; padding: 14px; }
.odds-n { display: flex; flex-direction: column; align-items: flex-start; flex: none; }
.odds-n b { font-size: 34px; font-weight: 800; line-height: 1; color: var(--accent); }
.odds-n span { font-size: 12px; color: var(--muted); }
.odds p { font-size: 14px; }
.scenes { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
.scenes li { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 8px; }
.scenes .num { color: var(--muted); font-size: 12px; padding-top: 2px; }
details.picks summary { cursor: pointer; list-style: none; }
details.picks summary::-webkit-details-marker { display: none; }
details.picks summary h2::after { content: " ＋"; }
details.picks[open] summary h2::after { content: " －"; }
.last { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 20px 18px; display: flex; flex-direction: column; gap: 10px; }
.last > p:not(.fine) { font-size: 16px; line-height: 1.75; }
.sign { display: flex; justify-content: space-between; align-items: center; gap: 12px; border-top: 1px solid var(--line); padding-top: 12px; margin-top: 6px; color: var(--muted); font-size: 13px; }
.stamp.big { font-size: 20px; padding: 4px 14px; border-width: 3px; transform: rotate(-6deg); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11px; color: var(--muted); margin-top: 8px; align-items: center; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: -1px; margin-right: 4px; }
svg text { fill: var(--muted); font-family: var(--font-data); font-size: 10px; }
svg text.me { fill: var(--accent); font-weight: 700; font-size: 11px; }
.jobs li { padding: 6px 0; border-bottom: 1px dashed var(--line); }
.jobs { list-style: none; padding: 0; margin: 0; font-size: 14px; }

/* ── 확률 도구 ── */
const rand = Math.random;
function pick(weights) {
  const entries = Object.entries(weights).filter(([, w]) => w > 0);
  const total = entries.reduce((s, [, w]) => s + w, 0);
  let r = rand() * total;
  for (const [k, w] of entries) { if ((r -= w) <= 0) return k; }
  return entries[entries.length - 1][0];
}
function gammaDraw(k) {
  if (k < 1) return gammaDraw(k + 1) * Math.pow(rand(), 1 / k);
  const d = k - 1 / 3, c = 1 / Math.sqrt(9 * d);
  for (;;) { const x = normal(), v = Math.pow(1 + c * x, 3); if (v <= 0) continue; const u = rand(); if (Math.log(u) < 0.5 * x * x + d - d * v + d * Math.log(v)) return d * v; }
}
/* '떠나는 확률' 배수. 평균 mean, 모양 shape 인 감마분포(shape 1000 이면 모두 거의 같은 값). 실제 유지 곡선에 맞춘 보정값(prototype/calibrate.js). */
function drawM(role) { const h = R[role].hetero; return h ? h.mean * gammaDraw(h.shape) / h.shape : 1; }
/* 45세부터는 사람 사이 차이가 줄어 평균(1)으로 다가간다. fade: 45세 이후 해마다 차이를 남기는 비율. 보정값(prototype/calibrate.js). */
function mEff(P) { const h = R[P.origRole] && R[P.origRole].hetero; if (!h || !h.fade || P.age < 45) return P.m; return 1 + (P.m - 1) * Math.pow(h.fade, P.age - 44); }
function normal() { let u = 0, v = 0; while (!u) u = rand(); while (!v) v = rand(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
const choose = (arr) => arr[Math.floor(rand() * arr.length)];
const pct = (x, d = 0) => (x * 100).toFixed(d) + "%";
/* 분위(아래에서 몇 %)를 늘 '상위 N%'로 쓴다. 상위 73%면 10명 중 7.3명이 나보다 위. */
const topPct = (below) => `상위 ${Math.min(100, Math.max(1, Math.round((1 - below) * 100)))}%`;
const won = (x) => Math.round(x).toLocaleString("ko-KR");
const band = (age) => BANDS[Math.max(0, Math.min(8, Math.floor((age - 20) / 5)))];
const age3 = (age) => age <= 34 ? "~34" : age <= 44 ? "35~44" : "45+";
const age3Label = { "~34": "34세 이하", "35~44": "35~44세", "45+": "45세 이상" };

function interp(table, age) {
  const v = BANDS.map((b) => table[b]);
  if (age <= BAND_MID[0]) return v[0];
  for (let i = 1; i < BAND_MID.length; i++) {
    if (age <= BAND_MID[i]) { const f = (age - BAND_MID[i - 1]) / 5; return v[i - 1] + (v[i] - v[i - 1]) * f; }
  }
  return v[v.length - 1];
}
const sexRatio = (role, sex) => (R[role].sex_wage_ratio || {})[sex] || 1;
const sizeMult = (role, size) => (R[role].size_mult || { S: 1, M: 1, L: 1 })[size];
function avgSizeMult(role) {
  const r = R[role]; if (!r.first_size9) return 1;
  return Object.entries(r.first_size9).reduce((s, [k, w]) => s + w * sizeMult(role, S9_TO_3[k]), 0);
}
function marketWage(role, sex, age, size) { return interp(R[role].wage_by_age, age) * sexRatio(role, sex) * sizeMult(role, size); }
function transCell(role, sex, age) {
  const r = R[role];
  if (role === "planner") return { cell: r.trans[age3(age)], fallback: true };
  const cell = r.trans[sex][age3(age)];
  const fb = r.trans_fallback.some((s) => s.startsWith(sex + " " + age3(age)));
  return { cell, fallback: fb };
}

/* ── 사람 만들기 ── */
function drawStartAge(role, sex) {
  const q = R[role === "planner" ? "designer" : role].start_age[sex];
  return Math.round(pick({ [q[0]]: 1, [q[1]]: 2, [q[2]]: 1 }));
}
/* 노동패널 나이별 곡선(2009~2024 합산)을 청년패널 첫 월급 수준으로 끌어올리는 배수 */
function levelFor(role, sex, age) {
  const r = R[role];
  const base = role === "planner" ? interp(r.wage_by_age, age) : interp(r.wage_by_age, age) * sexRatio(role, sex) * avgSizeMult(role);
  return (r.first_wage[sex] ?? r.first_wage) / base;
}
function josaRo(word) {
  const c = word.charCodeAt(word.length - 1) - 0xac00;
  if (c < 0 || c > 11171) return word + "로";
  const jong = c % 28;
  return word + (jong === 0 || jong === 8 ? "로" : "으로");
}
function newPerson(role, sex, opts = {}) {
  const r = R[role];
  const age = opts.age ?? drawStartAge(role, sex);
  let size9, size;
  if (r.first_size9) { size9 = pick(r.first_size9); size = S9_TO_3[size9]; } else { size = pick({ S: .4, M: .38, L: .22 }); size9 = null; }
  const p0 = levelFor(role, sex, age);
  // 같은 규모 안 개인차. 청년패널 신입 디자이너 첫 월급(n=112): 25% 200, 중앙 225, 75% 250, 95% 300만 원 → 로그 표준편차 약 0.18
  const p = p0 * Math.exp(0.18 * normal());
  const company = choose(COMPANY[role][size]);
  return {
    role, origRole: role, sex, age, startAge: age, t: 0, status: "wage", size, size9, company,
    regular: r.regular_share ? rand() < r.regular_share : true,
    p, p0, m: drawM(role), selfNoise: 1, energy: 70, skill: 30, noneYears: 0, end: null,
    name: opts.name || choose(NAMES[sex]),
    wages: [], sats: [], statuses: [], roles: [], jobs: [{ company, size, size9, role, from: 0, to: null, kind: "wage" }],
    moods: {}, flags: {}, switchedAt: null,
    married: false, marriedAt: null, kids: [], life: [], dating: 1, study: null, pause: null, bonus: 0, picks: [],
    rep: 10, rank: 0, xp: { res: 8, ux: 8, vis: 12, com: 6 }, projects: [], best: 0, lastAlloc: null,
  };
}
function currentWage(P) {
  if (P.status === "none" || P.status === "school") return 0;
  if (P.status === "leave") { const w = marketWage(P.role, P.sex, P.age, P.size) * P.p; return LEAVE_PAY(w); }
  if (P.status === "self") return interp(R[P.role].self_income_by_age || R[P.role].wage_by_age, P.age) * P.p * P.selfNoise;
  if (P.role === "planner") return interp(R.planner.wage_by_age, P.age) * P.p;
  return marketWage(P.role, P.sex, P.age, P.size) * P.p;
}

function goAway(P, dest, reason) {
  P.status = "away"; P.awayYears = 0; P.awayKind = dest; P.noneYears = 0;
  P.flags.leftN = (P.flags.leftN || 0) + 1;

/* 올해 선택(초점·카드)이 확률을 얼마나 움직였는지 한 줄로 */
const FX_LABEL = { same_job: "지금 회사에 남을", new_job_same_occupation: "다른 회사로 옮길", other_occupation: "디자인을 떠날", not_employed: "일을 쉬게 될", back: "디자이너로 돌아올", to_self: "프리랜서로 독립할" };
function fxLine(w0, w1, extra) {
  const n = (w) => { const s = Object.values(w).reduce((a, b) => a + b, 0); return Object.fromEntries(Object.entries(w).map(([k, v]) => [k, v / s])); };
  const a = n(w0), b = n(w1);
  let best = extra && extra.a ? { ...extra, r: Math.abs(Math.log(extra.b / extra.a)) } : null;
  for (const k in a) { if (!FX_LABEL[k] || !a[k]) continue; const r = Math.abs(Math.log(b[k] / a[k])); if (r > .03 && (!best || r > best.r)) best = { k, a: a[k], b: b[k], r }; }
  if (!best || best.r <= .03) return null;
  return { kind: "fx", text: `올해 선택·성과로 ${FX_LABEL[best.k]} 가능성 ${pct(best.a, 1)} → ${pct(best.b, 1)}`, why: "초점·카드·프로젝트가 거는 배수는 게임 설계상 가정이다.", grade: "D" };
}

/* ── 1년 진행 ──
   mods: 이번 해 확률 배수 (반기 초점·카드 선택). 설계상 가정(D). 흐름대로 = 배수 없음 = 원자료 그대로. */
function step(P, mods = {}) {
  const out = [];
  if (P.end) return out;
  const r = R[P.role], roleName = ROLE[P.role];
  const { cell, fallback } = transCell(P.role, P.sex, P.age);
  const who = P.role === "planner" ? `${age3Label[age3(P.age)]} ${roleName}` : `${SEX[P.sex]} ${age3Label[age3(P.age)]} ${roleName}`;
  const cellNote = fallback && P.role !== "planner" ? " (성별 칸 표본이 30건 미만이라 남녀 합계 사용)" : "";

  if (P.status === "away") {
    P.awayYears++;
    const c = P.awayYears === 1 ? RET.other_first : RET.other_later;
    const pb = c.back * (mods.back || 1);
    const fxa = pb !== c.back ? fxLine({ back: c.back, stay: 1 - c.back }, { back: pb, stay: 1 - c.back }) : null; if (fxa) out.push(fxa);
    const why = `${SRC.klips}: 디자이너를 떠나 다른 직업으로 일하던 사람이 다음 해 디자이너로 돌아온 비율 — 떠난 첫해 ${pct(c === RET.other_first ? c.back : RET.other_first.back, 1)}(${RET.other_first.n}건), 그 뒤 해마다 ${pct(RET.other_later.back, 1)}(${RET.other_later.n}건).${mods.back ? " 이번 해 선택이 이 비율에 배수를 걸었다(설계상 가정 D)." : ""}`;
    if (rand() < pb) {
      comeback(P, out, `${AWAY_NAME[P.awayKind]} 일을 정리하고 디자이너로 돌아왔다.`, why);
    } else if (P.awayYears >= AWAY_MAX) {
      P.end = P.awayKind === "planner" ? { type: "planner", text: `기획자로 옮긴 지 ${AWAY_MAX}년, 디자이너로 돌아오지 않았다.` } : { type: "other", text: `${josaRo(AWAY_NAME[P.awayKind])} 옮긴 지 ${AWAY_MAX}년, 디자이너로 돌아오지 않았다.` };
      P.jobs.at(-1).to = P.t + 1;
      out.push({ kind: "end", big: true, text: P.end.text + " 디자이너 커리어는 여기서 마친다.", why: why + ` ${AWAY_MAX}년이 지나면 기록을 마친다(설계상 가정).`, grade: "B" });
    } else {
      const left = AWAY_MAX - P.awayYears;
      out.push({ kind: "away", text: `${josaRo(AWAY_NAME[P.awayKind])} 한 해를 더 일했다. 디자이너를 떠난 지 ${P.awayYears}년, ${left === 1 ? "내년이 디자이너로 돌아갈 마지막 기회다." : `돌아갈 기회가 ${left}번 남았다.`}`, why, grade: "B" });
    }

  }
  if (P.status === "none") {

    const w = { back: re.back * (mods.back || 1), other: re.other, still: re.still * (mods.still || 1) };
    const fxn = fxLine({ back: re.back, other: re.other, still: re.still }, w); if (fxn) out.push(fxn);
    const k = pick(w);
    const why = `${SRC.klips}: 일을 쉬던 ${roleName}의 다음 해 상태 ${re.n}건(${P.noneYears <= 1 ? "쉰 첫해" : "쉰 지 2년 이상"}) 중 같은 일 복귀 ${pct(re.back)}, 다른 일 ${pct(re.other)}, 계속 쉼 ${pct(re.still)}.`;
    if (k === "back") {
      const gapY = P.noneYears;

      P.jobs.push({ company: P.company, size: P.size, role: P.role, from: P.t + 1, to: null, kind: "wage" });
      out.push({ kind: "back", big: true, text: `공백 ${gapY}년 만에 ${roleName}로 다시 일을 시작했다. ${P.company}, ${SIZE3[P.size]}.`, why, grade: "B" });
    } else if (k === "other") {
      const dest = r.dest ? pick(r.dest) : "other";

    } else {

  const base = `${SRC.klips}: ${who}의 다음 해 상태 ${cell.n}건${cellNote} — 같은 직장 ${pct(cell.same_job, 1)}, 같은 직군 이직 ${pct(cell.new_job_same_occupation, 1)}, 다른 직업 ${pct(cell.other_occupation, 1)}, 쉼 ${pct(cell.not_employed, 1)}.`;
  const modNote = Object.keys(mods).length ? " 이번 해 선택이 이 비율에 배수를 걸었다(설계상 가정 D)." : "";
  const quitWhy = (skip = []) => {

    const q = pick(Object.fromEntries(Object.entries(src.quit).filter(([k]) => !skip.includes(k))));
    return { q, note: ` 떠난 이유는 ${SRC.yp} 퇴사 ${src.quit_n}건의 사유 분포에서 뽑았다: "${q}" ${pct(src.quit[q], 1)}.` };
  };

  if (k === "same_job") {
    if (P.status === "wage" && rand() < (r.to_self || 0) * (mods.to_self || 1)) {

      out.push({ kind: "self", big: true, text: `회사를 나와 프리랜서 ${roleName}로 독립했다.`, why: `${SRC.klips}: 같은 직군에 남은 임금근로 ${roleName}가 다음 해 자영업이 되는 비율 연 ${pct(r.to_self, 1)}.${modNote}`, grade: "B" });

      P.jobs.at(-1).to = P.t + 1;
      P.jobs.push({ company: P.company, size: P.size, role: P.role, from: P.t + 1, to: null, kind: "wage" });
      out.push({ kind: "back", big: true, text: `프리랜서를 접고 ${P.company}(${SIZE3[P.size]})에 들어갔다.`, why: `${SRC.klips}: 자영업 ${roleName}가 다음 해 임금근로로 돌아가는 비율 연 ${pct(r.self_to_wage, 1)}. 규모는 소규모 출발 행을 썼다.`, grade: "B" });
    } else {
      // 이직자 웃돈만큼 남은 사람은 조금 덜 올라, 평균은 나이별 곡선에 머문다

const SFX = (() => {

let S = null;

function startGame(role, sex) {

  const peers = peerRoles.map((r) => {

function satisfaction(P, ctx) {
  const base = Object.values(R[P.role === "planner" ? "designer" : P.role].sat).reduce((a, b) => a + b, 0) / 9;
  let s = base + (P.energy - 50) / 100;
  if (P.status === "wage" || P.status === "self") {
    const mkt = P.status === "self" ? interp(R[P.role].self_income_by_age, P.age) : marketWage(P.role, P.sex, P.age, "M");
    s += 0.6 * Math.log(Math.max(currentWage(P), 30) / mkt / Math.max(P.p0 || 1, .5));

function finishYear(ctx) {

  }

    if (life === "birth") peerLines.push({ kind: "peer", text: `${x.name} (${ROLE[x.origRole]}) — ${x.kids.length > 1 ? "둘째" : "첫아이"}가 태어났다.`, why: lifeWhy(x, "birth"), grade: "C" });

const $app = document.getElementById("app");
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
/* '왜?'에는 실제 데이터 인용만 보여 준다. 설계상 가정(D)만 있는 근거는 숨기고, 섞여 있으면 가정 문장을 뺀다. */
function citeOnly(why, grade) {
  if (!why || !grade || grade === "D") return "";
  return why.split(/(?<=[.)])\s+/).filter((x) => !/설계상|게임 설계|가정이다/.test(x)).join(" ").trim();
}
function whyHtml(why, grade, label = "근거", open = false) {
  const t = citeOnly(why, grade);
  if (!t) return "";
  if (open) return `<p class="evidence">${esc(t)}</p>`;
  return `<details class="why"><summary>${label}</summary><div class="whybody">${esc(t)}</div></details>`;
}

function render() {
  const role = S.player ? S.player.role : S.pickRole;
  $app.dataset.role = S.screen === "start" ? "designer" : role;
  $app.dataset.screen = S.screen;
  if (S.screen === "start") return renderStart();
  if (S.screen === "reveal") return renderReveal();
  if (S.screen === "play") return renderPlay();
  if (S.screen === "record") return renderRecord();
  if (S.screen === "data") return renderData();
}

function to60(g) {
  const r = R[g], share = (sx) => { const m = cohort(g, sx); return m.ends.filter((e) => e.type === "retire" && e.same).length / m.N; };
  return pct(share("female") * r.female_share + share("male") * (1 - r.female_share));
}

/* 같은 성별 신입의 첫 월급 분포 (게임과 같은 방식으로 3,000명) */
const FW = {};
function firstWageDist(role, sex) {
  const k = role + sex;
  if (!FW[k]) FW[k] = Array.from({ length: 3000 }, () => currentWage(newPerson(role, sex))).sort((a, b) => a - b);
  return FW[k];
}
/* 사람 모양 10개를 첫 월급 순으로 세운다(왼쪽이 가장 많이, 오른쪽 끝이 가장 적게 받는 사람).
   n(소수 가능)명만큼 칠한다: fromRight면 오른쪽 끝부터, 아니면 왼쪽부터 */
let personRowN = 0;
function personRow(n, fromRight = false) {
  const uid = "pr" + (++personRowN);
  const body = "M12 1.5a5.5 5.5 0 1 1 0 11a5.5 5.5 0 1 1 0-11ZM3 44V24.5C3 18.7 7 15 12 15s9 3.7 9 9.5V44Z";
  return `<svg viewBox="0 0 ${10 * 26} 46" width="100%" aria-hidden="true">${Array.from({ length: 10 }, (_, i) => {
    const f = Math.max(0, Math.min(1, n - (fromRight ? 9 - i : i))), x = i * 26 + 1;
    return `<g transform="translate(${x} 0)"><path d="${body}" fill="var(--line)"/>${f > 0 ? `<clipPath id="${uid}c${i}"><rect x="${fromRight ? (24 * (1 - f)).toFixed(1) : 0}" y="0" width="${(24 * f).toFixed(1)}" height="46"/></clipPath><path d="${body}" fill="var(--accent)" clip-path="url(#${uid}c${i})"/>` : ""}</g>`;
  }).join("")}</svg>`;
}

function limitHtml(P) {
  if (P.end || (P.status !== "none" && P.status !== "away")) return "";
  const left = P.status === "none" ? BREAK_MAX - P.noneYears : AWAY_MAX - P.awayYears;
  const what = P.status === "none" ? "다시 일하지" : "디자이너로 돌아오지";
  return `<div class="limit">${left <= 1 ? "올해" : `${left}년 안에`} ${what} 못하면 게임 종료</div>`;
}
function statusText(P) {
  if (P.end) return P.end.text;
  if (P.status === "none") return "쉬는 중";
  if (P.status === "away") return `${josaRo(AWAY_NAME[P.awayKind])} 일하는 중`;
  if (P.status === "self") return `프리랜서 ${ROLE[P.role]}`;
  if (P.status === "leave") return `육아휴직 중 · ${esc(P.company)}`;
  if (P.status === "school") return "대학원 재학 중";
  return `${esc(P.company)} · ${SIZE3[P.size]}`;
}

  else s.push("결혼은 하지 않았다.");
  if (P.flags.pet != null) s.push(P.flags.dog ? "강아지 커닝이 오래 곁에 있었다." : "고양이 픽셀이 오래 곁에 있었다.");
  const pr = percentile(mc.earn, earned);
  s.push(`일해서 번 돈은 모두 약 ${eok(earned)} 원. 같은 조건 ${mc.N.toLocaleString()}명의 중간값은 ${eok(mc.earn[Math.floor(mc.earn.length / 2)])} 원이었다${pr != null ? `(나는 ${topPct(pr)})` : ""}.`);
  const peerKeep = S.peers.filter((x) => !x.end && WORKING.includes(x.status) && x.role === x.origRole).length;
  s.push(`같이 입사한 동기 4명 중 ${peerKeep}명이 아직 처음 그 일을 하고 있다.`);
  s.push(`해마다 고른 초점과 ${P.picks.length}번의 선택은 확률을 조금 움직였을 뿐이다. 나머지는 같은 해 시작한 수많은 사람들의 평균, 그리고 운이었다.`);
  return s;
}


/* ── 커리어 길이 분포: 같은 조건 1,500명을 같은 엔진으로 굴린 결과에서 내 위치 ── */
const SHARE_URL = "https://zero3181.github.io/LoD/";
const STAMP = { retire: "정년", other: "커리어 마침", planner: "기획 전향", break: "긴 쉼" };
function careerSpot(P, mc) {
  const ys = mc.ends.map((e) => e.years), N = ys.length;
  const me = workYears(P);
  const lt = ys.filter((y) => y < me).length, eq = ys.filter((y) => y === me).length;
  const sorted = [...ys].sort((a, b) => a - b);
  const maxY = Math.max(...ys, me);
  const bins = Array(maxY + 1).fill(0); ys.forEach((y) => bins[y]++);
  return { me, back: mc.ends.filter((e) => e.back).length, N, lt, eq, longer: N - lt - eq, below: (lt + eq / 2) / N, median: sorted[Math.floor(N / 2)], bins, maxY, retire: mc.ends.filter((e) => e.type === "retire" && e.same).length };
}
function careerChart(P, sp) {
  const W = 320, H = 150, L = 8, Rr = 8, T = 22, B = 22;
  const n = sp.bins.length, bw = (W - L - Rr) / n, top = Math.max(...sp.bins);
  const y = (v) => T + (1 - v / top) * (H - T - B);
  const bars = sp.bins.map((v, i) => { if (!v && i !== sp.me) return ""; const me = i === sp.me; return `<rect x="${(L + i * bw + .5).toFixed(1)}" y="${y(v).toFixed(1)}" width="${Math.max(1, bw - 1).toFixed(1)}" height="${(H - B - y(v)).toFixed(1)}" rx="1" fill="${me ? "var(--accent)" : "color-mix(in oklab, var(--muted) 35%, var(--surface))"}"/>`; }).join("");
  const mx = L + (sp.me + .5) * bw, medx = L + (sp.median + .5) * bw;
  let ticks = ""; for (let t = 0; t < n; t += 5) ticks += `<text x="${(L + (t + .5) * bw).toFixed(1)}" y="${H - 6}" text-anchor="middle">${t}년</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="디자이너로 일한 햇수 분포와 내 위치">
    <line x1="${medx.toFixed(1)}" x2="${medx.toFixed(1)}" y1="${T - 4}" y2="${H - B}" stroke="var(--muted)" stroke-dasharray="3 3"/>
    <text x="${(medx + 4).toFixed(1)}" y="${T + 6}">중간 ${sp.median}년</text>
    ${bars}${ticks}
    <line x1="${mx.toFixed(1)}" x2="${mx.toFixed(1)}" y1="${T - 12}" y2="${y(sp.bins[sp.me]) - 2}" stroke="var(--accent)" stroke-width="1.5"/>
    <text class="me" x="${mx.toFixed(1)}" y="${T - 14}" text-anchor="${mx > W - 40 ? "end" : mx < 40 ? "start" : "middle"}">나 ${sp.me}년</text></svg>`;
}
function careerLine(P, sp) {
  return `같은 해 ${SEX[P.sex]} ${ROLE[P.origRole]}로 시작한 ${sp.N.toLocaleString()}명 중 ${sp.lt.toLocaleString()}명은 디자이너로 나보다 짧게, ${sp.longer.toLocaleString()}명은 더 오래 일했다. 오래 일한 순서로 ${topPct(sp.below)}.`;
}
/* 공유 카드 이미지 (1080×1350 PNG) */
async function shareImage(P, title, sp, earned) {
  try { await document.fonts.load('700 40px "Pretendard Variable"'); } catch (e) {}
  const c = document.createElement("canvas"); c.width = 1080; c.height = 1350;
  const g = c.getContext("2d"), F = '"Pretendard Variable", "Apple SD Gothic Neo", sans-serif';
  const C = { bg: "#ffffff", ink: "#15181c", muted: "#5b636d", line: "#cfd4da", acc: "#2541b2", stamp: "#c2352b", bar: "#c9ced6" };
  g.fillStyle = "#e9ecef"; g.fillRect(0, 0, 1080, 1350);
  g.fillStyle = C.bg; g.fillRect(40, 40, 1000, 1270);
  g.fillStyle = C.acc; g.fillRect(40, 40, 1000, 18);
  const txt = (t, x, y, size, color, w = 700, align = "left") => { g.font = `${w} ${size}px ${F}`; g.fillStyle = color; g.textAlign = align; g.fillText(t, x, y); };
  const wrap = (t, x, y, maxW, size, color, lh, w = 500) => { g.font = `${w} ${size}px ${F}`; g.fillStyle = color; g.textAlign = "left"; let line = ""; for (const wd of t.split(" ")) { const next = line ? line + " " + wd : wd; if (line && g.measureText(next).width > maxW) { g.fillText(line, x, y); y += lh; line = wd; } else line = next; } if (line) g.fillText(line, x, y); return y + lh; };
  txt(`커리어 기록부 · ${START_YEAR}–${START_YEAR + P.t - 1}`, 100, 150, 30, C.muted, 500);
  let y = wrap(title, 100, 230, 880, 64, C.ink, 80, 800);
  y = wrap(`${P.startAge}세 ${SEX[P.sex]} ${ROLE[P.origRole]}로 시작해 ${endAge(P)}세에 기록을 마쳤다. ${P.end.text}`, 100, y + 10, 880, 32, C.muted, 46);
  // 도장
  g.save(); g.translate(850, y + 92); g.rotate(-0.12); g.strokeStyle = C.stamp; g.lineWidth = 6; g.font = `800 40px ${F}`; const sw = g.measureText(STAMP[P.end.type]).width + 44; g.strokeRect(-sw / 2, -36, sw, 72); g.fillStyle = C.stamp; g.textAlign = "center"; g.fillText(STAMP[P.end.type], 0, 14); g.restore();
  // 큰 숫자 (도장은 오른쪽)
  y += 40;
  txt(`${sp.me}년`, 100, y + 90, 120, C.acc, 800);
  txt(`디자이너로 일한 시간 · 오래 일한 순서로 ${topPct(sp.below)}`, 100, y + 145, 32, C.ink, 600);
  // 분포 막대
  const cx = 100, cw = 880, ch = 300, cy = y + 200, n = sp.bins.length, bw = cw / n, top = Math.max(...sp.bins);
  sp.bins.forEach((v, i) => { const h = v / top * (ch - 40); g.fillStyle = i === sp.me ? C.acc : C.bar; g.fillRect(cx + i * bw + 1, cy + ch - h, Math.max(2, bw - 3), h); });
  g.strokeStyle = C.line; g.lineWidth = 2; g.beginPath(); g.moveTo(cx, cy + ch + 1); g.lineTo(cx + cw, cy + ch + 1); g.stroke();
  for (let t = 0; t < n; t += 5) txt(`${t}년`, cx + (t + .5) * bw, cy + ch + 40, 24, C.muted, 500, "center");
  const mx = cx + (sp.me + .5) * bw; txt("나", mx, cy + ch - (sp.bins[sp.me] / top) * (ch - 40) - 14, 30, C.acc, 800, "center");
  txt(`같은 조건 ${sp.N.toLocaleString()}명이 디자이너로 일한 햇수 · 중간값 ${sp.median}년`, 100, cy + ch + 90, 26, C.muted, 500);
  // 하단
  txt(`번 돈 약 ${eok(earned)} 원 · 일자리 ${P.jobs.filter((j) => j.kind !== "school").length}곳`, 100, 1180, 30, C.ink, 600);
  txt("디자이너로 살아보기", 100, 1250, 34, C.acc, 800);
  txt(SHARE_URL.replace(/^https:\/\//, ""), 980, 1250, 26, C.muted, 500, "right");
  return new Promise((res) => c.toBlob((b) => res(b), "image/png"));
}

  $app.querySelector("#data").onclick = () => { S.screen = "data"; S.back = "record"; render(); };
  const note = (t) => { $app.querySelector("#copy-note").textContent = t; };
  const shortTxt = `[${title}] ${P.startAge}세 ${SEX[P.sex]} ${ROLE[P.origRole]}로 시작해 디자이너로 ${sp.me}년, ${RANKS[P.rank].name}까지, ${STAMP[P.end.type]}. 같은 조건 ${sp.N.toLocaleString()}명 중 오래 일한 순서로 ${topPct(sp.below)}. 과연 정년까지 일할 수 있을까요?`;
  const fullTxt = `[${title}]\n${P.startAge}세 ${SEX[P.sex]} ${ROLE[P.origRole]}로 시작 → ${endAge(P)}세. ${P.end.text}\n디자이너로 ${sp.me}년 · 같은 조건 ${sp.N.toLocaleString()}명 중 오래 일한 순서로 ${topPct(sp.below)} · 번 돈 약 ${eok(earned)} 원 · 최고 월 ${won(peak)}만 원\n` +
    scenes.slice(0, 6).map((x) => `${START_YEAR + x.t} ${x.text}`).join("\n") + "\n" + P.jobs.map((j) => `${START_YEAR + j.from} ${ROLE[j.role]} ${j.company}`).join("\n") + `\n\n디자이너로 살아보기 ${SHARE_URL}`;
  const copy = (t, msg) => navigator.clipboard.writeText(t).then(() => note(msg), () => note(t));
  const download = (blob) => { const u = URL.createObjectURL(blob), a = document.createElement("a"); a.href = u; a.download = "designer-career.png"; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000); };
  $app.querySelector("#copy").onclick = () => copy(fullTxt, "기록을 글로 복사했습니다.");
  $app.querySelector("#save-img").onclick = async () => { note("이미지를 만드는 중…"); const b = await shareImage(P, title, sp, earned); if (b) { download(b); note("이미지를 저장했습니다."); } else note("이미지를 만들지 못했습니다."); };
  const doShare = async () => {
    note("공유 카드를 만드는 중…");
    const b = await shareImage(P, title, sp, earned).catch(() => null);
    const file = b && typeof File === "function" ? new File([b], "designer-career.png", { type: "image/png" }) : null;
    try {
      if (file && navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], text: shortTxt + " " + SHARE_URL }); note(""); return; }
      if (navigator.share) { await navigator.share({ title: "디자이너로 살아보기", text: shortTxt, url: SHARE_URL }); note(""); return; }
    } catch (e) { if (e && e.name === "AbortError") { note(""); return; } }
    // 공유 창이 없는 브라우저: 글을 복사하고 이미지를 내려받는다
    copy(shortTxt + " " + SHARE_URL, "공유 글을 복사했고, 카드 이미지를 내려받았습니다.");
    if (b) download(b);
  };
  $app.querySelectorAll('#share,[data-act="share"]').forEach((x) => x.onclick = doShare);
}

    const age = f.age.map((x, i) => x * r.female_share + m.age[i] * (1 - r.female_share));
    const band = f.band.map((x, i) => x * r.female_share + m.band[i] * (1 - r.female_share));
    return { g, r, sim: [1, 3, 5, 10, 12, 15].map(both), obs: ["1y", "3y", "5y", "10y", "12y", "15y"].map((k) => r.keep_young[k]), age, band, bandObs: ["25", "30", "35", "40", "45", "50"].map((k) => r.keep_band[k]) };

    <section><h2>첫 직장과 월급</h2><div class="tw"><table><thead><tr><th></th><th class="r">디자이너</th></tr></thead><tbody>

    <section><h2>결혼·출산·이혼</h2>
      <p class="fine">결혼은 노동패널에서 올해 미혼인 사람이 다음 해 기혼인 비율입니다(성별 × 2세 단위 나이, 직군 무관). 결혼한 사람이 조사에서 빠지는 탓에 낮게 잡혀, 2020 인구총조사 30대 미혼율(남 50.8%, 여 33.6%)에 맞게 남 ×${G.life.marry_scale.male}, 여 ×${G.life.marry_scale.female}를 곱했습니다. 그 결과 게임 속 평균 첫 결혼 나이는 남 33.0세, 여 30.7세입니다(통계청 2024: 33.9세, 31.6세). 결혼 확률은 표본이 있는 49세까지만 씁니다. 아래 표는 배수를 곱한 뒤의 값입니다.</p>

    <section><h2>설계상 가정 (D)</h2><ul class="sources" style="list-style:disc">
      <li>한 턴은 1년입니다. PRD의 반기 턴은 연간 자료를 그대로 쓰기 위해 1년으로 바꿨습니다.</li>
      <li>프로젝트: 프로젝트 유형 ${Object.keys(PTYPES).length}종과 업계 ${Object.keys(TOPICS).length}종의 '맞는 배분', 리뷰 점수 공식, 직급 조건(일한 햇수·평판), 승진 때 월급 +3%. 리뷰 평균이 8점 이상이면 그해 다른 직업으로 옮길 확률 ×0.75·쉬게 될 확률 ×0.85, 4점 이하면 ×1.3·×1.2. 평판은 이직 확률에 ×0.9~1.3, 떠나 있는 동안 최고 리뷰 점수는 복귀 확률에 ×0.8~1.25를 겁니다. 점수에 따른 월급 변화는 해마다 ±2% 안쪽입니다. 확률표 자체는 노동패널 그대로입니다.</li>
      <li>돌발 상황과 팀: 돌발 상황 ${PEV.length}종의 발생 확률(일하는 해의 약 55%, 첫 프로젝트 제외), 선택지별 효과, 경험에 따른 성공 확률(25~92%). 리드 2명·디렉터 3명의 팀 규모, 팀원의 기여 시간·성장·의욕·이탈 규칙.</li>
      <li>올해의 초점이 거는 확률 배수(쉬거나 다른 직업으로 일하는 동안의 적극 지원 ×2, 포트폴리오 정비 ×1.4 포함), 일하는 동안 일·회사·성장 카드를 1.6배 자주 뽑는 비중, 이번 판 목표의 행복 기준(평균 만족도 ${HAPPY}), 사건 카드 ${CARD_N}종의 내용과 효과, 에너지·실력·만족도 계산. 사건은 한 판에서 한 번씩만 나옵니다. 근거 통계가 있는 카드는 '왜?'에 출처와 함께 등급 C로 표시했습니다.</li>
      <li>육아휴직 뒤 원래 직장 복귀, 석사 뒤 월급 +3~6%, 부수입·지출 카드의 금액.</li>
      <li>60세 종료, 공백 ${BREAK_MAX}년째 종료, 다른 직업 ${AWAY_MAX}년 종료, 쉬게 된 이유(노동패널에 없어 청년패널 퇴사 사유나 최근 출산으로 붙임), 회사 이름 예시.</li>
      <li>'통계 확률로 일어난 일'(교통사고, 우울증·공황장애·탈모 진료)은 전국 한 해 인원을 인구 약 5,120만 명으로 나눈 확률을 모든 나이에 똑같이 씁니다. 우울증은 한 해 진료받은 사람 수라 새로 걸리는 확률보다 높게 잡혔을 수 있고, 에너지가 35 아래면 ×1.5로 두었습니다.</li>
      <li>첫 월급의 개인차(같은 회사 규모 안 로그 표준편차 0.18)는 청년패널 신입 디자이너 첫 월급의 분포(25% 200만, 중앙 225만, 95% 300만 원)에 맞춘 값입니다.</li>
      <li>다른 직업으로 옮겨도 바로 끝나지 않습니다. 해마다 디자이너로 돌아올 수 있고(노동패널: 떠난 첫해 ${pct(RET.other_first.back, 1)} n=${RET.other_first.n}, 그 뒤 ${pct(RET.other_later.back, 1)} n=${RET.other_later.n}), ${AWAY_MAX}년 안에 돌아오지 않으면 기록을 마칩니다. ${AWAY_MAX}년과, 그동안 월급을 디자이너 곡선으로 두는 것은 설계상 가정입니다. 다른 일을 하다 쉬게 되는 경우(연 11%)는 넣지 않았습니다.</li>
      <li>일을 쉬던 사람의 복귀는 쉰 첫해(같은 일 ${pct(R.designer.reentry.back)}, n=${R.designer.reentry.n})와 그 뒤(${pct(RET.not_employed_later.back)}, n=${RET.not_employed_later.n})를 나눠 씁니다.</li>
    </ul></section>

    why: () => `노동패널 2022~2024: 스스로 건강하다고 답한 임금근로자 ${pct(WK.all.healthy.p)}(디자이너 ${pct(WK.designer.healthy.p)}). 규칙적으로 운동한다 ${pct(WK.all.exercise_regular.p)}. 효과는 설계상 가정.`, grade: "C",
    choices: [
      { label: "PT를 끊는다", hint: "에너지 +12, −150만", apply: (P) => { P.energy += 12; P.bonus -= 150; return "석 달 뒤 계단을 두 칸씩 올랐다."; } },
      { label: "점심 산책부터", hint: "에너지 +5", apply: (P) => { P.energy += 5; return "하루 7천 보. 시작은 했다."; } },
      { label: "나중에", hint: "에너지 −4", apply: (P) => { P.energy -= 4; return "엘리베이터를 기다렸다."; } },
    ] },
];
const CARD_N = CARDS.filter((c) => !c.trigger && !c.force && !c.roll).length;
const tv = (v, ...a) => typeof v === "function" ? v(...a) : v;

/* ── 결혼·출산·이혼 (데이터) ──
   결혼: 노동패널 12~27차 미혼 → 다음 해 기혼 비율(성별 x 2세 단위 나이). 결혼한 사람이 조사에서 빠지는 탓에 낮게 잡혀,
         2020 인구총조사 30대 미혼율(남 50.8%, 여 33.6%)에 맞도록 성별 배수를 곱했다(남 x1.6, 여 x1.67).
         그 결과 게임 안 평균 첫 결혼 나이: 남 33.5세, 여 31.6세 (통계청 2024: 33.9세, 31.6세).
   출산: 결혼 다음 해부터 첫째 연 30%(3년까지), 12%(6년까지), 이후 3%. 둘째는 첫째 다음 해부터 4년간 연 13%. 엄마 나이 44세까지.
         통계청 2024 출생통계 첫째아 33.1세·둘째 34.4세에 맞췄다. 게임 속 여성: 첫째 32.8세, 둘째 34.4세, 1인당 아이 0.94명(등급 C).
   이혼: 노동패널 기혼 → 다음 해 이혼·별거 비율(성별 x 나이대), 연 0.4~0.6%. */
function marryP(P) {
  const L = G.life, a = Math.max(20, Math.min(48, P.age - (P.age % 2)));
  return Math.min(.6, (L.marry[P.sex][a] || 0) * L.marry_scale[P.sex] * (P.dating || 1));
}
const BIRTH = { first: [.3, .12, .03], second: .13 };
const motherAge = (P) => P.sex === "female" ? P.age : P.age - 2;
function birthP(P) {
  if (!P.married || motherAge(P) > 44) return 0;
  if (!P.kids.length) { const y = P.t - P.marriedAt; return y < 1 ? 0 : y <= 3 ? BIRTH.first[0] : y <= 6 ? BIRTH.first[1] : BIRTH.first[2]; }
  if (P.kids.length === 1) { const y = P.t - P.kids[0]; return y >= 1 && y <= 4 && motherAge(P) <= 42 ? BIRTH.second : 0; }
  return 0;
}
function divorceP(P) { const d = G.life.divorce[P.sex]; return P.married ? (P.age <= 34 ? d["~34"] : P.age <= 44 ? d["35~44"] : d["45~59"]) : 0; }
function lifeRoll(P) {
  if (!P.married) return rand() < marryP(P) ? "marry" : null;
  const b = birthP(P);
  if (b && rand() < b) return "birth";
  if (rand() < divorceP(P)) return "divorce";
  return null;
}
function applyLife(P, kind) {
  if (kind === "marry") { P.married = true; P.marriedAt = P.t; P.life.push({ t: P.t, age: P.age, kind }); }
  if (kind === "birth") { P.kids.push(P.t); P.life.push({ t: P.t, age: P.age, kind, n: P.kids.length }); }
  if (kind === "divorce") { P.married = false; P.dating = 1; P.life.push({ t: P.t, age: P.age, kind }); }
}
function lifeWhy(P, kind) {
  const L = G.life;
  if (kind === "marry") {
    const a = Math.max(20, Math.min(48, P.age - (P.age % 2)));
    return `${SRC.klips}: ${a}~${a + 1}세 미혼 ${SEX[P.sex]}이 다음 해 결혼한 비율 ${pct(L.marry[P.sex][a], 1)}(${L.marry_n[P.sex][a]}건). 결혼한 사람이 조사에서 빠지는 탓에 낮게 잡혀, 2020 인구총조사 30대 미혼율(남 50.8%, 여 33.6%)에 맞게 ×${L.marry_scale[P.sex]}를 곱해 올해 ${pct(marryP(P), 1)}. 참고: 2024년 평균 첫 결혼 나이 여성 31.6세, 남성 33.9세(통계청).`;
  }
  if (kind === "birth") {
    const leave = P.sex === "female" ? "84.5%" : "16.1%";
    return `2024년 첫째아 평균 출산 나이 33.1세, 둘째 34.4세(통계청 출생통계)에 맞춘 연간 출산 확률(등급 C). 2023년에 아이를 낳은 임금근로자 부모 중 12개월 안에 육아휴직을 쓴 ${P.sex === "female" ? "엄마" : "아빠"}는 ${leave}(통계청 육아휴직통계). 아빠 육아휴직자의 약 70%는 300인 이상 기업 소속이다. 육아휴직급여는 2025년 기준 첫 3개월 월 250만 원, 4~6개월 200만 원, 이후 160만 원이 상한.`;
  }
  return `${SRC.klips}: 기혼 ${SEX[P.sex]}이 다음 해 이혼·별거 상태인 비율 연 ${pct(divorceP(P), 2)}.`;
}

/* ── 상태 ── */
let S = null;
function freshState() { return { screen: "start", manual: false, pickRole: "designer", pickSex: "female", focus: "flow", ask: false, autoPick: false, speed: 0, feed: [], card: null, check: null, player: null, peers: [] }; }

function startGame(role, sex) {
  const P = newPerson(role, sex, { name: "나" });
  const peerRoles = [role, role, role, role];
  const used = new Set();
  const peers = peerRoles.map((r) => {
    const sx = rand() < R[r].female_share ? "female" : "male";
    let name; do { name = choose(NAMES[sx]); } while (used.has(name)); used.add(name);
    return newPerson(r, sx, { name, age: Math.max(22, P.age + Math.round(normal())) });
  });
  S.player = P; S.peers = peers; S.feed = []; S.card = null; S.check = null; S.focus = "flow";
  S.screen = "reveal";
  render();
}

function sizeShare(role, size9) { return R[role].first_size9[size9]; }

function satisfaction(P, ctx) {
  const base = Object.values(R[P.role === "planner" ? "designer" : P.role].sat).reduce((a, b) => a + b, 0) / 9;
  let s = base + (P.energy - 50) / 100;
  if (P.status === "wage" || P.status === "self") {
    const mkt = P.status === "self" ? interp(R[P.role].self_income_by_age, P.age) : marketWage(P.role, P.sex, P.age, "M");
    s += 0.6 * Math.log(Math.max(currentWage(P), 30) / mkt / Math.max(P.p0 || 1, .5));
  } else s -= .3;
  if (P.status === "leave") s += .1;
  return Math.max(1, Math.min(5, s + (ctx.sat || 0)));
}

function playYear() {
  if (!S.player || S.player.end || S.card || S.check) return;
  const P = S.player;
  const ctx = { mods: { ...FOCUS[S.focus].mods }, sat: 0, notes: [], pause: null };
  if (P.pause) { finishYear(ctx); return; } // 휴직·학업 중에는 사건이 없다
  // 1) 강제 카드 2) 데이터로 굴린 삶의 사건 3) 아직 안 나온 사건 하나 (디자이너 전용판은 판이 짧아 해마다 하나씩)
  let card = CARDS.find((c) => c.force && c.force(P));
  if (!card) {
    const life = lifeRoll(P);
    if (life) { applyLife(P, life); card = CARDS.find((c) => c.trigger === life); }
  }
  // 통계의 연간 발생률로 굴리는 사건 (교통사고, 우울증 진료 등)
  if (!card) card = CARDS.find((c) => c.roll && !P.flags["card_" + c.id] && (!c.when || c.when(P, S)) && rand() < c.roll(P));
  if (!card) {
    const pool = CARDS.filter((c) => !c.force && !c.trigger && !c.roll && !P.flags["card_" + c.id] && c.when(P, S));
    if (pool.length) card = CARDS.find((c) => c.id === pick(Object.fromEntries(pool.map((c) => [c.id, c.w ? c.w(P, S) : 1]))));
  }
  if (card) { if (!card.repeat) P.flags["card_" + card.id] = true; S.card = { id: card.id, ctx }; render(); return; }
  finishYear(ctx);
}

function chooseCard(i) {
  const P = S.player, card = CARDS.find((c) => c.id === S.card.id);
  const ctx = S.card.ctx, ch = card.choices[i];
  if (ch.ok && !ch.ok(P)) return;
  const title = tv(card.title, P, S);
  const result = ch.apply(P, ctx);
  ctx.notes.push({ kind: "card", big: !!(card.trigger || card.roll), text: `${title} → ${ch.label}. ${result}`, why: tv(card.why, P, S), grade: card.grade || "D" });
  P.picks.push({ t: P.t, age: P.age, cat: card.cat, title, label: ch.label, result, life: !!card.trigger });
  if (card.id === "peer_wedding") S.peerWedding = null;
  S.card = null;
  finishYear(ctx);
}

/* 휴직·전일제 대학원: 그해는 확률표를 굴리지 않고 쉰다. 끝나면 복귀한다(설계상 가정). */
function startPause(P, pause) {
  P.pause = pause;
  P.status = pause.kind;
  if (pause.kind === "school") {
    P.jobs.at(-1).to = P.t;
    P.jobs.push({ company: "대학원 (전일제 석사)", size: null, role: P.role, from: P.t, to: P.t + pause.left, kind: "school", reason: "학업" });
  }
}
function pauseLine(P) {
  return P.status === "leave"
    ? { kind: "leave", big: true, text: `육아휴직 중이다. 월급 대신 육아휴직급여 월 약 ${won(currentWage(P))}만 원.`, why: lifeWhy(P, "birth"), grade: "B" }
    : { kind: "school", text: "대학원 수업과 논문으로 한 해가 갔다.", why: "전일제 석사 2년은 설계상 가정.", grade: "D" };
}
function endPause(P) {
  const kind = P.pause.kind; P.pause = null;
  if (kind === "leave") { P.status = "wage"; return { kind: "back", big: true, text: `${P.company}에 복직했다.`, why: "육아휴직 뒤 원래 직장으로 돌아간다고 두었다(설계상 가정). 다음 해부터는 다시 노동패널 확률을 따른다.", grade: "D" }; }
  P.flags.degree = true; P.status = "wage";
  P.size = pick(G.size_move[P.size || "S"]); P.company = choose(COMPANY[P.role][P.size]); P.p *= 1.06;
  P.jobs.push({ company: P.company, size: P.size, role: P.role, from: P.t, to: null, kind: "wage", reason: "석사 졸업" });
  return { kind: "back", big: true, text: `석사를 마치고 ${josaRo(P.company)} 들어갔다(${SIZE3[P.size]}).`, why: "졸업 후 월급 +6%와 회사 규모는 설계상 가정(규모 이동은 청년패널 행 사용).", grade: "D" };
}

function finishYear(ctx) {
  const P = S.player;
  const f = FOCUS[S.focus];
  let dE = f.energy - (P.status === "wage" && P.size === "S" ? 3 : 0) + (P.status === "none" ? 10 : 0);
  if (P.flags.pet != null) dE += 2;
  if (P.flags.exercise) dE += 2;
  if (P.kids.some((k) => P.t - k <= 5)) dE -= 4;
  if (P.study) dE -= 8;
  P.energy = Math.max(0, Math.min(100, P.energy + dE));
  P.skill = Math.max(0, Math.min(100, P.skill + f.skill));
  if (ctx.pause) startPause(P, ctx.pause);
  // 기록을 마치는 해에는 떠나기 전의 상태로 한 칸을 남긴다
  const pre = { wage: currentWage(P), status: P.status, role: P.role, sat: satisfaction(P, ctx) };
  let lines, resume = false;
  if (P.pause) { lines = [...ctx.notes, pauseLine(P)]; P.pause.left -= 1; resume = P.pause.left <= 0; }
  else lines = [...ctx.notes, ...step(P, ctx.mods)];
  if (P.study && !P.end) {
    P.study.left -= 1;
    if (P.study.left <= 0) { P.study = null; P.flags.degree = true; P.p *= 1.03; P.skill += 6; lines.push({ kind: "degree", big: true, text: "야간 석사를 마쳤다. 졸업식에는 회사 동료 두 명이 왔다.", why: "학위 뒤 월급 +3%는 설계상 가정.", grade: "D" }); }
  }
  const yearT = P.t;
  const peerLines = [];
  for (const x of S.peers) {
    if (x.end) continue;
    const ev = step(x).filter((e) => e.big);
    const life = lifeRoll(x);
    if (life) applyLife(x, life);
    advanceAge(x);
    x.wages.push(currentWage(x));
    const PEER = { move: () => `${josaRo(x.company)} 옮겼다.`, switch: () => `${ROLE[x.role]}로 전향했다.`, self: () => "프리랜서로 독립했다.", back: () => "다시 회사에 들어갔다.", none: () => "일을 쉬게 됐다.", end: () => x.end.text };
    if (life === "marry") { peerLines.push({ kind: "peer", text: `${x.name} (${ROLE[x.origRole]}) — 결혼한다는 소식을 전했다.`, why: lifeWhy(x, "marry"), grade: "B" }); if (!P.flags.card_peer_wedding) S.peerWedding = x.name; }
    if (life === "birth") peerLines.push({ kind: "peer", text: `${x.name} (${ROLE[x.origRole]}) — ${x.kids.length > 1 ? "둘째" : "첫아이"}가 태어났다.`, why: lifeWhy(x, "birth"), grade: "C" });
    for (const e of ev) peerLines.push({ kind: "peer", text: `${x.name} (${ROLE[x.origRole]}) — ${(PEER[e.kind] || (() => e.text))()}`, why: e.why, grade: e.grade });
  }
  advanceAge(P);
  if (P.end && P.end.type === "retire") lines.push({ kind: "end", big: true, text: P.end.text, why: "노동패널 55세 이상 표본이 적어 60세에서 끝낸다(설계상 가정).", grade: "D" });
  if (!P.end || P.end.type === "retire") {
    P.wages.push(currentWage(P)); P.statuses.push(P.status); P.roles.push(P.role);
    P.sats.push(satisfaction(P, ctx));
  } else { P.wages.push(pre.wage); P.statuses.push(pre.status); P.roles.push(pre.role); P.sats.push(pre.sat); }
  if (resume && !P.end) lines.push(endPause(P));
  S.feed.push({ t: yearT, year: START_YEAR + yearT, age: P.age - 1, lines: [...lines, ...peerLines.slice(0, 3)] });
  if (P.end) { S.speed = 0; S.screen = "record"; render(); return; }
  if (CHECKS.includes(P.t)) { S.check = { t: P.t }; }
  render();
}

/* ── 자동 진행 ── */
let timer = null;
function setSpeed(v) { S.speed = v; schedule(); render(); }
/* 자동 선택: 카드 선택지와 올해의 초점을 무작위로 고른다. 에너지가 35 아래면 쉬기를 고른다. */
function autoFocus() {
  const P = S.player;
  if (P.energy < 35) return "rest";
  return pick({ flow: 3, work: 1.5, grow: 1.5, move: 1, side: .7, rest: .8 });
}
function autoChoice() {
  const P = S.player, card = CARDS.find((c) => c.id === S.card.id);
  const ok = card.choices.map((c, i) => (!c.ok || c.ok(P) ? i : -1)).filter((i) => i >= 0);
  return ok[Math.floor(rand() * ok.length)];
}
function schedule() {
  clearTimeout(timer);
  if (!S.speed || S.screen !== "play" || !S.player || S.player.end) return;
  if (S.check) { if (S.autoPick) timer = setTimeout(() => { S.check = null; render(); schedule(); }, 2000 / S.speed); return; }
  if (S.card) { if (S.autoPick) timer = setTimeout(() => { chooseCard(autoChoice()); render(); schedule(); }, 2600 / S.speed); return; }
  timer = setTimeout(() => { if (S.autoPick) { S.focus = autoFocus(); S.ask = false; } playYear(); schedule(); }, 1600 / S.speed);
}
function setAutoPick(v) { S.autoPick = v; if (v && !S.speed) S.speed = 1; render(); schedule(); }

/* ── 그리기 ── */
const $app = document.getElementById("app");
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
/* '왜?'에는 실제 데이터 인용만 보여 준다. 설계상 가정(D)만 있는 근거는 숨기고, 섞여 있으면 가정 문장을 뺀다. */
function citeOnly(why, grade) {
  if (!why || !grade || grade === "D") return "";
  return why.split(/(?<=[.)])\s+/).filter((x) => !/설계상|게임 설계|가정이다/.test(x)).join(" ").trim();
}
function whyHtml(why, grade, label = "근거", open = false) {
  const t = citeOnly(why, grade);
  if (!t) return "";
  if (open) return `<div class="evidence"><div class="evidence-label">${label}</div>${esc(t)}</div>`;
  return `<details class="why"><summary>${label}</summary><div class="whybody">${esc(t)}</div></details>`;
}

function render() {
  const role = S.player ? S.player.role : S.pickRole;
  $app.dataset.role = S.screen === "start" ? "designer" : role;
  if (S.screen === "start") return renderStart();
  if (S.screen === "reveal") return renderReveal();
  if (S.screen === "play") return renderPlay();
  if (S.screen === "record") return renderRecord();
  if (S.screen === "data") return renderData();
}

function to60(g) {
  const r = R[g], share = (sx) => { const m = cohort(g, sx); return m.ends.filter((e) => e.type === "retire" && e.same).length / m.N; };
  return pct(share("female") * r.female_share + share("male") * (1 - r.female_share));
}

function statusText(P) {
  if (P.end) return P.end.text;
  if (P.status === "none") return "쉬는 중";
  if (P.status === "self") return `프리랜서 ${ROLE[P.role]}`;
  if (P.status === "leave") return `육아휴직 중 · ${esc(P.company)}`;
  if (P.status === "school") return "대학원 재학 중";
  return `${esc(P.company)} · ${SIZE3[P.size]}`;
}

function satColor(s) { return `color-mix(in oklab, var(--accent) ${Math.round(12 + (s - 1) / 4 * 80)}%, var(--surface))`; }

function wageChart(P) {
  const W = 320, H = 170, L = 34, Rr = 8, T = 10, B = 24;
  const ages = P.wages.map((_, i) => P.startAge + i + 1);
  const med = ages.map((a, i) => { const role = P.roles[i]; return interp(R[role].wage_by_age, a) * sexRatio(role, P.sex) * levelFor(role, P.sex, P.startAge); });
  const maxY = Math.max(100, ...P.wages, ...med) * 1.1;
  const step = maxY > 800 ? 200 : 100;
  const x = (a) => L + (a - P.startAge) / Math.max(1, ages.at(-1) - P.startAge) * (W - L - Rr);
  const y = (v) => T + (1 - v / maxY) * (H - T - B);
  let grid = "";
  for (let v = 0; v <= maxY; v += step) grid += `<line x1="${L}" x2="${W - Rr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 4}" y="${y(v) + 3}" text-anchor="end">${v}</text>`;
  const firstTick = Math.ceil(P.startAge / 5) * 5;
  for (let a = firstTick; a <= ages.at(-1); a += 5) grid += `<text x="${x(a)}" y="${H - 6}" text-anchor="middle">${a}세</text>`;
  const path = (arr) => arr.map((v, i) => `${i ? "L" : "M"}${x(ages[i]).toFixed(1)},${y(v).toFixed(1)}`).join("");
  const mine = P.wages.map((v, i) => [v, i]).filter(([v]) => v > 0);
  const dots = mine.map(([v, i]) => `<circle cx="${x(ages[i]).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2.2" fill="var(--accent)"/>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="나이별 월급">
    ${grid}<path d="${path(med)}" fill="none" stroke="var(--muted)" stroke-dasharray="4 3" stroke-width="1.2"/>
    <path d="${path(P.wages)}" fill="none" stroke="var(--accent)" stroke-width="2"/>${dots}</svg>
    <div class="legend"><span><i style="background:var(--accent)"></i>내 월급(만 원)</span><span><i style="background:var(--muted)"></i>같은 성별·직군 나이별 중앙값(첫 월급 수준에 맞춤)</span></div>`;
}

const eok = (manwon) => (manwon / 10000).toFixed(1).replace(/\.0$/, "") + "억";
const NAT = { marry: { female: 31.6, male: 33.9 }, firstBirth: 33.1 };
function lifetime(P) { return P.wages.reduce((s, w) => s + w * 12, 0) + P.bonus; }
function titleFor(P) {
  const self = P.statuses.filter((x) => x === "self").length;
  const jobs = P.jobs.filter((j) => j.kind === "wage").length;
  if (P.end.type === "retire" && P.role === P.origRole && jobs <= 2) return `한 우물을 판 ${ROLE[P.role]}`;
  if (P.end.type === "retire" && P.role !== P.origRole) return `두 번 시작한 ${ROLE[P.role]}`;
  if (P.end.type === "retire" && self >= P.sats.length / 2) return "혼자 일한 사람";
  if (P.end.type === "retire" && jobs >= 6) return `${jobs}개의 회사를 거친 ${ROLE[P.role]}`;
  if (P.end.type === "retire") return `끝까지 남은 ${ROLE[P.role]}`;
  if (P.end.type === "planner") return "화면을 정하는 사람이 된 " + ROLE[P.origRole];
  if (P.end.type === "break") return "잠시 멈춰 선 사람";
  return `${P.t}년 만에 커리어를 마친 ${ROLE[P.role]}`;
}
function rarity(P, mc) {
  const me = P.end.type;
  const hit = mc.ends.filter((e) => e.type === me && (me === "retire" ? e.same === (P.role === P.origRole) : Math.abs(e.years - P.t) <= 2)).length;
  const what = me === "retire" ? (P.role === P.origRole ? `60세까지 ${ROLE[P.origRole]}로 남은 사람` : "중간에 직군을 바꿔 60세까지 일한 사람")
    : me === "planner" ? `${P.t}년 차 앞뒤로 기획 쪽으로 옮긴 사람` : me === "break" ? `${P.t}년 차 앞뒤로 긴 쉼에 들어간 사람` : `${P.t}년 차 앞뒤로 다른 직업으로 옮기며 커리어를 마친 사람`;
  return { hit, what };
}
function neverMarriedP(P) { // 시작 나이부터 지금까지 결혼하지 않았을 확률 (데이터 확률만으로)
  let s = 1; for (let a = P.startAge; a < P.age; a++) { const k = Math.max(20, Math.min(48, a - (a % 2))); s *= 1 - Math.min(.6, (G.life.marry[P.sex][k] || 0) * G.life.marry_scale[P.sex]); }
  return s;
}
function lifeScenes(P) {
  const out = [];
  const how = (e) => { const p = P.picks.find((x) => x.life && x.t === e.t); return p ? ` (${p.label})` : ""; };
  for (const e of P.life) {
    if (e.kind === "marry") { const d = e.age - NAT.marry[P.sex]; out.push({ t: e.t, text: `${e.age}세에 결혼했다${how(e)}.`, note: `대한민국 ${SEX[P.sex]} 평균 첫 결혼 나이 ${NAT.marry[P.sex]}세보다 ${Math.abs(d).toFixed(1)}년 ${d < 0 ? "빨랐다" : "늦었다"}.` }); }
    if (e.kind === "birth") { const ma = motherAge({ ...P, age: e.age }); out.push({ t: e.t, text: `${e.age}세에 ${e.n > 1 ? "둘째" : "첫아이"}가 태어났다${how(e)}.`, note: e.n === 1 ? `첫째를 낳는 엄마의 평균 나이는 ${NAT.firstBirth}세${P.sex === "male" ? `, 이 기록의 배우자는 약 ${ma}세` : ""}.` : "" }); }
    if (e.kind === "divorce") out.push({ t: e.t, text: `${e.age}세에 따로 살기로 했다.`, note: "" });
  }
  for (const p of P.picks) {
    if (p.life) continue;
    if (["love", "family", "friend"].includes(p.cat) || /휴직|석사|계약한다|데려온다|간다|쓴다/.test(p.label)) {
      if (!out.some((o) => o.t === p.t && o.text.includes(p.title))) out.push({ t: p.t, text: `${p.title} → ${p.label}`, note: "" });
    }
  }
  if (!P.married && !P.life.some((e) => e.kind === "divorce")) out.push({ t: P.t, text: "결혼은 하지 않았다.", note: `같은 나이·성별 확률로만 보면 ${P.startAge}세부터 ${P.age}세까지 결혼하지 않을 가능성은 ${pct(neverMarriedP(P))}였다.` });
  return out.sort((a, b) => a.t - b.t);
}
function epilogue(P, mc, earned) {
  const jobs = P.jobs.filter((j) => j.kind === "wage").length;
  const s = [];
  if (P.end.type === "retire") s.push(P.role !== P.origRole ? `${P.age}세, 마지막 출근 날. ${ROLE[P.origRole]}로 시작해 ${ROLE[P.role]}로 일을 마쳤다.` : `${P.age}세, 마지막 출근 날. ${jobs}곳의 회사를 거쳐 끝까지 ${ROLE[P.role]}로 일했다.`);
  else if (P.end.type === "planner") s.push(`${P.age}세에 기획 쪽으로 자리를 옮겼다. 화면을 만들던 사람이 이제 무엇을 만들지 정한다.`);
  else if (P.end.type === "break") s.push(`${P.age}세, 쉬는 시간이 길어졌다. 다시 돌아올지는 이 기록부도 모른다.`);
  else s.push(`${P.age}세에 ${ROLE[P.role]} 일을 내려놓고 다른 직업으로 옮겼다. ${ROLE[P.role]}로서의 커리어는 여기서 마친다.`);
  const ma = P.life.find((e) => e.kind === "marry");
  if (ma) s.push(`${ma.age}세에 결혼했고${P.kids.length ? `, 아이 ${P.kids.length}명을 키웠다.` : ", 아이는 없었다."}`);
  else s.push("결혼은 하지 않았다.");
  if (P.flags.pet != null) s.push(P.flags.dog ? "강아지 커닝이 오래 곁에 있었다." : "고양이 픽셀이 오래 곁에 있었다.");
  const pr = percentile(mc.earn, earned);
  s.push(`일해서 번 돈은 모두 약 ${eok(earned)} 원. 같은 조건 ${mc.N.toLocaleString()}명의 중간값은 ${eok(mc.earn[Math.floor(mc.earn.length / 2)])} 원이었다${pr != null ? `(나는 ${topPct(pr)})` : ""}.`);
  const peerKeep = S.peers.filter((x) => !x.end && x.status !== "none" && x.role === x.origRole).length;
  s.push(`같이 입사한 동기 4명 중 ${peerKeep}명이 아직 처음 그 일을 하고 있다.`);
  s.push(`해마다 고른 초점과 ${P.picks.length}번의 선택은 확률을 조금 움직였을 뿐이다. 나머지는 같은 해 시작한 수많은 사람들의 평균, 그리고 운이었다.`);
  return s;
}

      <p class="fine" style="margin-top:6px">보정: 위 두 표에 함께 맞춰, 다른 직업으로 옮기거나 일을 쉬는 해마다의 확률에 ×${R.designer.hetero.mean}을 곱했습니다(prototype/calibrate.js). 10·12·15년 관찰값은 거의 같은 사람들이고 표본이 작아(n=30·24·11) 무게를 낮췄습니다. 그래서 60세까지 디자이너로 남는 비율은 대략 3~10% 범위로 보는 게 맞습니다.</p></section>
    <section><h2>참고: 일하는 사람의 나이 분포</h2>
      <p class="fine">게임은 처음 직군으로 들어온 사람만, 매년 같은 수가 들어온다고 보고 굴린 분포입니다. 노동패널은 2020~2024년 그 직군 취업자(60세 미만)입니다. 실제 30~40대에는 다른 일을 하다 중간에 들어오거나 돌아온 사람이 섞여 있어서, 게임보다 나이 든 쪽이 두껍습니다. 그래서 이 표는 보정 목표로 쓰지 않았습니다.</p>
      <div class="tw"><table><thead><tr><th></th><th class="r">30세 미만</th><th class="r">30대</th><th class="r">40대</th><th class="r">50대</th></tr></thead><tbody>
      ${rows.map((x) => `<tr><td>${ROLE[x.g]} 게임</td>${x.age.map((v) => `<td class="r num">${pct(v)}</td>`).join("")}</tr><tr><td>${ROLE[x.g]} 노동패널</td>${x.r.age_dist.share.map((v) => `<td class="r num">${pct(v)}</td>`).join("")}</tr>`).join("")}
      </tbody></table></div></section>
    <section><h2>첫 직장과 월급</h2><div class="tw"><table><thead><tr><th></th><th class="r">디자이너</th></tr></thead><tbody>
      <tr><td>한 해 첫 출근 추정 (청년패널 가중치, 1993~1996년생)</td><td class="r num">${ROLE_W.designer.toLocaleString("ko-KR")}명</td></tr>
      <tr><td>첫 직장 관찰 수 (청년패널)</td><td class="r num">${R.designer.weight}</td></tr>
      <tr><td>여성 비율</td><td class="r num">${pct(R.designer.female_share)}</td></tr>
      <tr><td>첫 월급 중앙값 여성 / 남성</td><td class="r num">${won(R.designer.first_wage.female)} / ${won(R.designer.first_wage.male)}</td></tr>
      <tr><td>첫 직장 30명 미만</td><td class="r num">${pct(R.designer.first_size9["1~4"] + R.designer.first_size9["5~9"] + R.designer.first_size9["10~29"])}</td></tr>
      <tr><td>나이별 월급 중앙값 45~49세 (노동패널)</td><td class="r num">${won(R.designer.wage_by_age["45~49"])}</td></tr>
      <tr><td>성별 월급 배수 여성 / 남성 (25~44세)</td><td class="r num">${R.designer.sex_wage_ratio.female} / ${R.designer.sex_wage_ratio.male}</td></tr>
      <tr><td>다른 직업으로 옮긴 디자이너의 도착지: 개발자 / 기획자</td><td class="r num">${pct(R.designer.dest.developer)} / ${pct(R.designer.dest.planner || 0)}</td></tr>
      </tbody></table></div>
      <p class="fine" style="margin-top:6px">월급은 노동패널 나이별 곡선(2009~2024년 합산, 물가 보정 전)의 모양에 청년패널 첫 월급 수준을 맞춘 값입니다. 사람마다 ±25% 정도 차이(로그정규)를 두었고, 이 폭은 설계상 가정입니다. 회사 규모별 배수는 노동패널 25~44세에서 계산했습니다.</p></section>
    <section><h2>디자이너와 일반 직장인</h2>
      <p class="fine">회사 생활 카드의 근거입니다. 노동패널 2022~2024년 조사, 20~59세 임금근로자 사람-해 단위, 비가중. 디자이너는 ${WK.designer.n}건(같은 사람이 여러 해 들어 있음)이라 오차가 큽니다. 만족은 '매우 만족·만족' 비율입니다.</p>
      <div class="tw"><table><thead><tr><th></th><th class="r">임금근로자 전체</th><th class="r">디자이너</th></tr></thead><tbody>
      ${[["정규직", (g) => WK[g].regular.p], ["지금 직장 근속 중앙값", (g) => WK[g].tenure_median + "년"], ["초과근로가 있다", (g) => WK[g].overtime.p], ["초과근로 수당을 못 받는다 (초과근로자 중)", (g) => g === "designer" ? `${pct(WK[g].overtime_unpaid.p)} (n=${WK[g].overtime_unpaid.n})` : WK[g].overtime_unpaid.p],
         ["성과급제가 있다", (g) => WK[g].performance_pay.p], ["직장에 노조가 있다", (g) => WK[g].union_exists.p],
         ...["임금", "고용안정", "일의 내용", "근로시간", "발전가능성", "인간관계", "인사고과 공정성", "복리후생", "일자리 전반"].map((k) => [`만족: ${k}`, (g) => WK[g].job_sat[k].sat.p]),
         ["만족: 여가활동", (g) => WK[g].life_sat["여가활동"].sat.p], ["스스로 건강하다", (g) => WK[g].healthy.p], ["주 1회 이상 음주", (g) => WK[g].drink_weekly.p], ["흡연", (g) => WK[g].smoke.p]]
        .map(([lab, f]) => `<tr><td>${lab}</td>${["all", "designer"].map((g) => { const v = f(g); return `<td class="r num">${typeof v === "number" ? pct(v) : v}</td>`; }).join("")}</tr>`).join("")}
      </tbody></table></div>
      <p class="fine" style="margin-top:6px">공식 통계로 만든 카드: 첫 일자리 평균 근속 1년 6.4개월(청년층 부가조사 2025), 가장 오래 다닌 일자리를 그만둔 나이 52.9세(고령층 부가조사 2025), 직장 내 괴롭힘 경험·목격 28.8%(고용노동부 2024 실태조사), 출퇴근 왕복 73.9분(통계청 2024 통근 분석, 실험 통계), 아빠 육아휴직 시점(육아휴직통계).</p></section>
    <section><h2>결혼·출산·이혼</h2>
      <p class="fine">결혼은 노동패널에서 올해 미혼인 사람이 다음 해 기혼인 비율입니다(성별 × 2세 단위 나이, 직군 무관). 결혼한 사람이 조사에서 빠지는 탓에 낮게 잡혀, 2020 인구총조사 30대 미혼율(남 50.8%, 여 33.6%)에 맞게 남 ×${G.life.marry_scale.male}, 여 ×${G.life.marry_scale.female}를 곱했습니다. 그 결과 게임 속 평균 첫 결혼 나이는 남 33.5세, 여 31.6세입니다(통계청 2024: 33.9세, 31.6세). 아래 표는 배수를 곱한 뒤의 값입니다.</p>
      <div class="tw"><table><thead><tr><th>나이</th>${[24, 26, 28, 30, 32, 34, 36, 38, 40].map((a) => `<th class="r">${a}</th>`).join("")}</tr></thead><tbody>
      ${["female", "male"].map((sx) => `<tr><td>${SEX[sx]}</td>${[24, 26, 28, 30, 32, 34, 36, 38, 40].map((a) => `<td class="r num">${pct(G.life.marry[sx][a] * G.life.marry_scale[sx], 1)}<br><span class="fine">n=${G.life.marry_n[sx][a]}</span></td>`).join("")}</tr>`).join("")}
      </tbody></table></div>
      <p class="fine" style="margin-top:6px">출산은 결혼 다음 해부터 첫째 연 30%(3년까지), 12%(6년까지), 이후 3%, 둘째는 첫째 다음 해부터 4년간 연 13%로 두었습니다. 통계청 2024년 출생통계의 첫째 33.1세·둘째 34.4세에 맞춘 값이고, 게임 속 여성은 첫째 32.8세, 둘째 34.4세, 1인당 아이 0.94명입니다. 2024년 합계출산율 0.75명보다는 조금 많습니다(등급 C). 이혼·별거는 노동패널 기혼자의 연간 비율 ${pct(G.life.divorce.female["35~44"], 2)}~${pct(G.life.divorce.male["~34"], 2)}를 그대로 씁니다. 육아휴직을 쓸지는 플레이어가 고르고, 카드에 2023년 실제 사용률(엄마 84.5%, 아빠 16.1%)을 보여 줍니다.</p></section>
    <section><h2>설계상 가정 (D)</h2><ul class="sources" style="list-style:disc">
      <li>한 턴은 1년입니다. PRD의 반기 턴은 연간 자료를 그대로 쓰기 위해 이번 프로토타입에서 1년으로 바꿨습니다.</li>
      <li>올해의 초점이 거는 확률 배수, 사건 카드 ${CARD_N}종의 내용과 효과, 에너지·실력·만족도 계산. 사건은 한 판에서 한 번씩만 나옵니다. 근거 통계가 있는 카드는 '왜?'에 출처와 함께 등급 C로 표시했습니다.</li>
      <li>육아휴직 뒤 원래 직장 복귀, 석사 뒤 월급 +3~6%, 부수입·지출 카드의 금액.</li>
      <li>60세 종료, 3년 연속 쉼 종료, 회사 이름 예시.</li>
      <li>'통계 확률로 일어난 일'(교통사고, 우울증·공황장애·탈모 진료)은 전국 한 해 인원을 인구 약 5,120만 명으로 나눈 확률을 모든 나이에 똑같이 씁니다. 우울증은 한 해 진료받은 사람 수라 새로 걸리는 확률보다 높게 잡혔을 수 있고, 에너지가 35 아래면 ×1.5로 두었습니다.</li>
      <li>첫 월급의 개인차(같은 회사 규모 안 로그 표준편차 0.18)는 청년패널 신입 디자이너 첫 월급의 분포(25% 200만, 중앙 225만, 95% 300만 원)에 맞춘 값입니다.</li>
      <li>다른 직업으로 옮긴 뒤 돌아오는 경우는 넣지 않았습니다. 노동패널에서 돌아오는 비율은 연 1~7%입니다.</li>
    </ul></section>
    <section><h2>출처</h2><ol class="sources">
      <li><a href="https://www.kli.re.kr/menu.es?mid=a40302000000" target="_blank" rel="noopener">한국노동연구원 한국노동패널 12~27차</a> — 연간 이동, 나이별 월급, 자영업, 복귀, 직군 전환 도착지, 일반 직장인 비교(2022~2024)</li>
      <li><a href="https://survey.keis.or.kr/yp/ypdownload/List.jsp" target="_blank" rel="noopener">한국고용정보원 청년패널 YP2021 직업력</a> — 첫 직장 규모·월급·나이, 퇴사 사유, 이직 공백, 기업 규모 이동</li>
      <li><a href="https://kosis.kr/statHtml/statHtml.do?orgId=101&tblId=DT_1ES4H07S" target="_blank" rel="noopener">KOSIS 경력단절여성 사유 (2024)</a> — 쉼 사건의 참고 문구</li>
      <li>통계청 2024년 혼인·이혼 통계 — 평균 첫 결혼 나이 / 2024년 출생통계 — 첫째아 평균 출산 나이 / 2023년 육아휴직통계 — 출생 후 12개월 안 사용률 / 2020 인구주택총조사 — 30대 미혼율</li>
      <li>고용노동부 육아휴직급여 상한(2025) · 통계청 임금근로일자리 소득(2023, 중위 250만 원) · 국토교통부 주거실태조사(생애 첫 집 43.3세, 2018 기준)</li>
      <li>통계청 경제활동인구조사 청년층 부가조사(2025.5) · 고령층 부가조사(2025.5) · 2024년 통근 시간 분석 · 육아휴직통계(2024) · 고용노동부 2024 직장 내 괴롭힘 실태조사(국회 제출 자료)</li>
      <li>경찰청 2024 교통사고 통계 · 건강보험심사평가원 우울증·탈모·불면증·척추질환 진료 인원(2024, 언론 보도) · 국민건강보험공단 공황장애 진료 인원(2021, 언론 보도) · 국가암등록통계(2022) · 중앙치매센터 치매 환자 추계(2024, 언론 보도)</li>
      <li>통계청 2024 국내인구이동통계 · 국가데이터처 2025 통계로 보는 1인 가구 · 국토교통부 전세사기 피해 실태(2025.5 국회 보고) · 금융감독원 2023 보이스피싱 피해 · 문화체육관광부 2025 국민 독서실태조사 · 한국관광공사 2024 출국 통계</li>
      <li>NH농협은행 축의금 이체 분석(2023~2025) · 농림축산식품부 2025 반려동물 양육현황조사(29.2%) · 직장갑질119 직장인 1,000명 설문(2025년 10월, 괴롭힘 경험 33%)</li>
      <li><a href="https://1in8b.life/ko/" target="_blank" rel="noopener">80억 분의 1 (1in8b.life)</a> — 영감을 받은 작품</li>
    </ol></section>
    <div class="form-row"><button class="btn" id="back">돌아가기</button></div>
  </div></div>`;
  $app.querySelector("#back").onclick = () => { S.screen = S.back || "start"; render(); };
}

/* ── 시작 ── */
function boot(saved) {
  S = saved && saved.S ? saved.S : freshState();
  if (S.screen === "play" && S.player) S.speed = 0;
  render();
}
window.claude?.hot?.snapshot?.(() => ({ S }));
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>

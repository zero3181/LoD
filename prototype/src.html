<style>
@font-face { font-family: "Pretendard Variable"; font-weight: 45 920; font-style: normal; font-display: swap; src: url("PretendardVariable.woff2") format("woff2-variations"); }
/* Layout: one phone-width column shaped like a personnel record — an ID card header, a running log, and a control strip. */
:root {
  /* Gris 디자인 시스템 (Claude Design '디자이너로 살아보기 리디자인' 1a 정돈) */
  --graphite-0: #FFFFFF; --graphite-25: #FAF8F3; --graphite-50: #F4F0E6; --graphite-100: #E7E2D6; --graphite-200: #D2CDC1; --graphite-300: #B3B1AA;
  --graphite-400: #949390; --graphite-500: #777674; --graphite-600: #5C5B5A; --graphite-700: #454444; --graphite-800: #302F30; --graphite-900: #1E1E1F;
  --bleu-50: #F0F7FB; --bleu-100: #DCEDF5; --bleu-200: #BFDFEC; --bleu-300: #9ED0E2; --bleu-400: #7FBFD6; --bleu-500: #5FA8C4; --bleu-600: #4A8CA8; --bleu-700: #3A6E85; --bleu-800: #2C5262; --bleu-900: #1F3A45;
  --ocre-100: #F4EBD4; --ocre-300: #DCC488; --ocre-500: #BC9440; --ocre-700: #7C5F27; --ocre-800: #5A451D; --ocre-900: #3C2E13;
  --terre-100: #F0E1D7; --terre-500: #9A6038; --terre-700: #643A21;
  --brique-400: #B8705C; --brique-500: #9C5A46; --brique-600: #7E4535;
  --radius-sm: 6px; --radius-md: 10px; --radius-lg: 14px; --radius-xl: 20px;
  --shadow-hairline: 0 0 0 .5px rgba(48,47,48,.16);
  --shadow-1: 0 1px 2px rgba(30,30,31,.08);
  --shadow-2: 0 2px 6px rgba(30,30,31,.09), 0 0 0 .5px rgba(48,47,48,.07);
  --shadow-3: 0 8px 24px rgba(30,30,31,.12), 0 0 0 .5px rgba(48,47,48,.06);
  --shadow-4: 0 20px 48px rgba(30,30,31,.18);
  --ease: cubic-bezier(.4,0,.2,1); --ease-out: cubic-bezier(.16,1,.3,1);

  --bg: var(--graphite-50);
  --surface: var(--graphite-0);
  --sunk: var(--graphite-100);
  --ink: var(--graphite-900);
  --muted: var(--graphite-600);
  --faint: var(--graphite-400);
  --line: var(--graphite-200);
  --des: var(--bleu-700);
  --dev: #5C7A4A;
  --plan: var(--ocre-700);
  --stamp: var(--brique-600);
  --ok: #5C7A4A;
  --fill-accent: var(--bleu-600);
  --fill-quiet: rgba(48,47,48,.06);
  --accent-soft: var(--bleu-100);
  --warm-soft: var(--ocre-100);
  --warm-ink: var(--ocre-900);
  --meter-fill: var(--graphite-800);
  --bar-bg: rgba(244,240,230,.88);
  --scrim: rgba(30,30,31,.42);
  --font-display: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-body: var(--font-display);
  --font-data: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --accent: var(--des);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121213; --surface: #1E1E1F; --sunk: #302F30; --ink: #F4F0E6; --muted: #B3B1AA; --faint: #777674; --line: #454444;
    --des: var(--bleu-300); --dev: #9DBB86; --plan: var(--ocre-300); --stamp: var(--brique-400); --ok: #9DBB86;
    --fill-quiet: rgba(244,240,230,.08); --accent-soft: rgba(74,140,168,.24); --warm-soft: rgba(188,148,64,.2); --warm-ink: var(--ocre-300);
    --meter-fill: var(--graphite-200); --bar-bg: rgba(18,18,19,.86); --scrim: rgba(0,0,0,.55);
    --shadow-2: 0 2px 6px rgba(0,0,0,.4), 0 0 0 .5px rgba(244,240,230,.08); --shadow-hairline: 0 0 0 .5px rgba(244,240,230,.18);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121213; --surface: #1E1E1F; --sunk: #302F30; --ink: #F4F0E6; --muted: #B3B1AA; --faint: #777674; --line: #454444;
  --des: var(--bleu-300); --dev: #9DBB86; --plan: var(--ocre-300); --stamp: var(--brique-400); --ok: #9DBB86;
  --fill-quiet: rgba(244,240,230,.08); --accent-soft: rgba(74,140,168,.24); --warm-soft: rgba(188,148,64,.2); --warm-ink: var(--ocre-300);
  --meter-fill: var(--graphite-200); --bar-bg: rgba(18,18,19,.86); --scrim: rgba(0,0,0,.55);
  --shadow-2: 0 2px 6px rgba(0,0,0,.4), 0 0 0 .5px rgba(244,240,230,.08); --shadow-hairline: 0 0 0 .5px rgba(244,240,230,.18);
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0; word-break: keep-all; overflow-wrap: anywhere;
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6; letter-spacing: -0.01em; font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.app {
  max-width: 560px; margin: 0 auto; height: 100%; display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
[data-role="developer"] { --accent: var(--dev); --fill-accent: #5C7A4A; --accent-soft: #E3EBDC; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) [data-role="developer"] { --fill-accent: #5C7A4A; --accent-soft: rgba(92,122,74,.28); } }
:root[data-theme="dark"] [data-role="developer"] { --fill-accent: #5C7A4A; --accent-soft: rgba(92,122,74,.28); }
[data-role="planner"] { --accent: var(--plan); }
h1, h2, h3 { font-family: var(--font-display); font-weight: 800; text-wrap: balance; margin: 0; letter-spacing: -0.03em; }
p { margin: 0; }
.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.label { font-size: 11px; letter-spacing: 0.08em; color: var(--muted); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn {
  border: 1px solid var(--ink); background: var(--ink); color: var(--surface); padding: 12px 18px; border-radius: 4px;
  font-weight: 600; min-height: 44px;
}
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn:disabled { opacity: .4; cursor: default; }
.sublink { margin: 12px 0 0; }
.textlink { background: none; border: 0; padding: 4px 0; font: inherit; font-size: 14px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.textlink:hover { color: var(--ink); }
.auto-offer { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 12.5px; color: var(--muted); padding: 6px 10px; margin-bottom: -4px; border-radius: 6px; background: var(--sunk); border: 1px solid var(--line); }
.auto-offer .textlink { font-size: 13px; color: var(--accent); font-weight: 600; padding: 2px 0; }
.scroll { flex: 1; overflow-y: auto; min-height: 0; padding-block: 20px; }

/* ── 시작 화면 ── */
.start { display: flex; flex-direction: column; gap: 28px; }
.start h1 { font-size: clamp(26px, 7.6vw, 40px); line-height: 1.2; white-space: nowrap; }
.start .lede { color: var(--muted); max-width: 34em; }
.form-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 8px 12px; min-height: 40px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); }
.facts div { background: var(--surface); padding: 12px; display: flex; flex-direction: column; gap: 2px; }
.facts b { font-family: var(--font-data); font-weight: 700; font-size: 20px; }
.facts span { font-size: 12px; color: var(--muted); }
.fine { font-size: 12px; color: var(--muted); }
.challenge { font-size: 19px; font-weight: 700; line-height: 1.45; letter-spacing: -0.02em; color: var(--accent); }
.facts .wide { grid-column: 1 / -1; }
details.manual summary { cursor: pointer; color: var(--muted); font-size: 13px; }
details.manual[open] summary { margin-bottom: 10px; }

/* ── 배정 연출 ── */
.waffle { display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; width: 104px; flex: none; }
.wage-rank { display: flex; gap: 14px; align-items: center; }
.people10 { max-width: 320px; }
.ends10 { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 2px; }
.wage-rank .ends { display: flex; flex-direction: column; justify-content: space-between; align-self: stretch; font-size: 11px; color: var(--muted); }
.goalres { margin-top: 10px; font-size: 13px; font-weight: 600; color: var(--muted); }
.goalres.ok { color: var(--accent); }
.newend { font-size: 14px; font-weight: 700; color: var(--accent); margin-bottom: 6px; }
.endings { display: flex; flex-wrap: wrap; gap: 6px; }
.endings span { font-size: 12.5px; padding: 5px 9px; border-radius: 6px; border: 1px dashed var(--line); color: var(--muted); }
.endings span.got { border-style: solid; color: var(--ink); background: var(--surface); }
.endings span.me { border-color: var(--accent); color: var(--accent); font-weight: 700; }
details.more > summary { font-size: 15px; font-weight: 700; cursor: pointer; padding: 10px 0; }
details.more[open] { display: flex; flex-direction: column; gap: 24px; }
.reveal-go { position: sticky; bottom: 0; display: flex; flex-direction: column; gap: 8px; padding: 14px 0 calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--bg); border-top: 1px solid var(--line); margin-top: 8px; }
.reveal-go .goal { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.moodbox summary { font-size: 13px; color: var(--muted); cursor: pointer; padding: 4px 0; }
.moodbox .mood { margin-top: 6px; }
.line.fx { font-size: 12.5px; color: var(--accent); }
.nextfocus .ff { align-self: flex-start; }
.nextfocus { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.nextfocus .q { font-size: 14px; font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { border: 1px solid var(--line); background: var(--sunk); border-radius: 999px; padding: 8px 14px; font-size: 14px; min-height: 40px; }
.chips button:hover { border-color: var(--accent); }
.chips button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: var(--surface); font-weight: 600; }
.waffle .dot.s { background: color-mix(in oklab, var(--accent) 38%, var(--surface)); }
.waffle .dot.m { background: var(--accent); }
.waffle .dot.me { background: var(--accent); outline-width: 1.5px; outline-offset: 1px; }
.steps { display: flex; flex-direction: column; gap: 10px; }
.step { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; font-size: 13px; }
.step b { font-size: 15px; }
.step .bar { grid-column: 1 / -1; height: 10px; background: var(--sunk); border: 1px solid var(--line); border-radius: 5px; overflow: hidden; }
.step .bar i { display: block; height: 100%; background: var(--accent); border-radius: 5px 0 0 5px; min-width: 3px; }
.step.l1 .bar i { background: color-mix(in oklab, var(--accent) 22%, var(--surface)); }
.step.l2 .bar i { background: color-mix(in oklab, var(--accent) 38%, var(--surface)); }
.sizebar { display: flex; height: 26px; border-radius: 5px; overflow: hidden; border: 1px solid var(--line); }
.sizebar span { display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--muted); background: var(--sunk); border-right: 1px solid var(--line); min-width: 0; overflow: hidden; white-space: nowrap; }
.sizebar span:last-child { border-right: 0; }
.sizebar span.on { background: var(--accent); color: var(--surface); font-weight: 700; }
.dots { display: grid; grid-template-columns: repeat(20, 1fr); gap: 4px; max-width: 360px; }
.funnel { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); }
.funnel div { background: var(--surface); padding: 10px; display: flex; flex-direction: column; gap: 2px; }
.funnel b { font-size: 18px; font-weight: 700; }
.funnel span { font-size: 12px; color: var(--muted); line-height: 1.4; }
.dot { aspect-ratio: 1; border-radius: 50%; background: var(--line); }
.dot.d { background: color-mix(in oklab, var(--des) 45%, var(--surface)); }
.dot.v { background: color-mix(in oklab, var(--dev) 45%, var(--surface)); }
.dot.me { outline: 2px solid var(--ink); outline-offset: 2px; background: var(--accent); animation: pop .6s ease-out; }
@keyframes pop { from { transform: scale(2.2); } to { transform: scale(1); } }

/* ── 사원증 헤더 ── */
.scene-wrap { flex: none; margin-top: 8px; }
.scene { display: block; width: 100%; height: auto; image-rendering: pixelated; border-radius: 6px; border: 1px solid var(--line); background: #bfe3f5; }
.scene-cap { font-size: 12px; color: var(--muted); margin-top: 3px; }
.idcard {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; margin-top: 12px;
  background: var(--surface); border: 1px solid var(--line); border-top: 6px solid var(--accent); border-radius: 6px;
  padding: 12px 14px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px;
}
.idcard .who { font-family: var(--font-display); font-size: 19px; font-weight: 700; }
.idcard .where { color: var(--muted); font-size: 13px; }
.idcard .where span { white-space: nowrap; }
.idcard .limit { display: inline-block; margin-top: 6px; padding: 3px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; color: var(--plan); background: color-mix(in srgb, var(--plan) 12%, transparent); }
.idcard .pay { text-align: right; }
.idcard .pay b { font-family: var(--font-data); font-size: 22px; font-weight: 500; }
.meters { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px 12px; font-size: 12px; color: var(--muted); margin-top: 4px; }
.meter { display: flex; flex-direction: column; gap: 3px; min-width: 0; white-space: nowrap; }
.meter i { display: block; width: 100%; height: 6px; background: var(--sunk); border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
.meter i::after { content: ""; display: block; height: 100%; width: var(--v); background: var(--accent); }
.meter.low i::after { background: var(--stamp); }

/* ── 기록 피드 ── */
.feed { display: flex; flex-direction: column; gap: 12px; }
.yr { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.yr.hot { border-color: color-mix(in oklab, var(--stamp) 55%, var(--line)); }
.yr-h { display: flex; align-items: baseline; gap: 8px; font-family: var(--font-data); font-size: 12px; color: var(--muted); }
.yr-h b { font-size: 15px; color: var(--ink); font-weight: 600; }
.yr-sat { font-size: 11.5px; } .yr-sat i { font-style: normal; margin-left: 3px; } .yr-sat .up { color: var(--accent); } .yr-sat .dn { color: var(--stamp); }
.meter.sat small { font-size: 11px; } .meter.sat b { color: var(--ink); font-weight: 600; }
.meter.sat.ok b { color: var(--accent); } .meter.sat.behind small b { color: var(--stamp); }
.satline { font-size: 14px; } .satline .ok { color: var(--accent); }
.goal-hint { flex-basis: 100%; }
.yr-h .yr-tag { margin-left: auto; font-style: normal; font-family: var(--font-body, inherit); font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; color: var(--accent); background: color-mix(in oklab, var(--accent) 13%, transparent); }
.yr.hot .yr-h .yr-tag { color: var(--stamp); background: color-mix(in oklab, var(--stamp) 13%, transparent); }
.chunk { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.chunk + .chunk { border-top: 1px dashed var(--line); padding-top: 10px; }
.ck { font-size: 11px; font-weight: 600; letter-spacing: .06em; color: var(--muted); }
.line { font-size: 14px; }
.line.big { font-weight: 600; }
.c-peer .line { color: var(--muted); font-size: 13px; }
.c-proj .line { font-size: 13px; color: var(--muted); }
.pj { display: flex; flex-direction: column; gap: 3px; }
.pj-top { display: flex; align-items: baseline; gap: 10px; justify-content: space-between; }
.pj-name { font-weight: 600; font-size: 14px; min-width: 0; }
.score { flex: none; font-size: 12px; color: var(--muted); white-space: nowrap; }
.score b { font-size: 16px; color: var(--ink); }
.score.hi b { color: var(--accent); } .score.lo b { color: var(--stamp); }
.pj .sub { font-size: 12.5px; color: var(--muted); }
.pj .pj-promo { font-size: 13px; font-weight: 600; color: var(--accent); }
.ev { display: flex; flex-direction: column; gap: 2px; }
.ev-t { font-weight: 600; font-size: 14px; }
.ev-c { font-size: 13px; color: var(--accent); }
.ev-r { font-size: 13.5px; }
.cash { font-family: var(--font-data); font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.cash.up { color: var(--accent); } .cash.dn, .neg { color: var(--stamp); }
.moneyline { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; font-size: 13px; color: var(--muted); }
.moneyline b { font-size: 14px; color: var(--ink); } .moneyline b.cash.up { color: var(--accent); } .moneyline b.cash.dn, .moneyline b.neg { color: var(--stamp); }
.moneyline .sub { flex-basis: 100%; font-size: 12px; }
.idcard .pay .asset { font-size: 12px; color: var(--muted); margin-top: 2px; white-space: nowrap; }
.idcard .pay .asset b { font-family: var(--font-data); font-size: 14px; font-weight: 500; color: var(--ink); }
.idcard .pay .asset.neg b { color: var(--stamp); }
.sheet.notice .rulebox { background: var(--sunk); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.sheet.notice ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
.why { display: inline; }

/* ── 조작 막대 ── */

.focus-hint { font-size: 12px; color: var(--muted); min-height: 1.5em; }
.go { display: flex; gap: 8px; }

.go .btn:first-child { flex: 1; white-space: nowrap; padding-inline: 12px; }

.career-svg { display: block; max-width: 520px; }
@media (max-width: 374px) { .go .seg button { padding-inline: 9px; } }

/* ── 카드 (이벤트·체크포인트) ── */
.sheet-wrap { position: fixed; inset: 0; background: color-mix(in oklab, var(--ink) 40%, transparent); display: flex; align-items: flex-end; justify-content: center; z-index: 20; }

  padding: 20px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));

}

.sheet .form-row:has(#notice-ok, #mood-save) + .autobar { order: -1; }
@keyframes rise { from { transform: translateY(24px); opacity: .6; } }
.sheet h2 { font-size: 22px; }
.choices { display: flex; flex-direction: column; gap: 8px; }

.autobar { height: 4px; background: var(--sunk); border-radius: 2px; overflow: hidden; }
.autobar i { display: block; height: 100%; width: 100%; background: var(--accent); transform-origin: left; animation: autofill linear forwards; }
@keyframes autofill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.autonote { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin-top: -6px; }

.cat { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: 0; color: var(--accent); border: 1px solid currentColor; border-radius: 999px; padding: 0 8px; margin-right: 4px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }

.tag.designer { color: var(--des); } .tag.developer { color: var(--dev); } .tag.planner { color: var(--plan); } .tag.other { color: var(--muted); }
td:first-child, th:last-child, td.r { white-space: nowrap; }

.mood { display: flex; gap: 8px; }

.bigstat { font-family: var(--font-display); font-size: 17px; line-height: 1.5; }
.bigstat b { font-weight: 700; color: var(--accent); }

/* ── 기록부 ── */
.record { display: flex; flex-direction: column; gap: 28px; }
.record header { display: flex; flex-direction: column; gap: 6px; position: relative; }
.stamp {
  align-self: flex-start; font-family: var(--font-display); color: var(--stamp); border: 2px solid var(--stamp); border-radius: 4px;
  padding: 2px 10px; font-size: 14px; transform: rotate(-3deg); letter-spacing: .1em;
}
.record h2 { font-size: 13px; font-family: var(--font-body); font-weight: 600; letter-spacing: .08em; color: var(--muted); border-bottom: 1px solid var(--line); padding-bottom: 6px; margin-bottom: 10px; }
.map { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 3px; }
.cell { aspect-ratio: 1; border-radius: 2px; position: relative; }

.cell.switch::after { content: ""; position: absolute; inset: 30%; border-radius: 50%; background: var(--surface); }

.rec-title { font-size: clamp(26px, 7vw, 34px); line-height: 1.2; }

.scenes { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; font-size: 14px; }

details.picks[open] summary h2::after { content: " －"; }
.last { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 20px 18px; display: flex; flex-direction: column; gap: 10px; }

.sign { display: flex; justify-content: space-between; align-items: center; gap: 12px; border-top: 1px solid var(--line); padding-top: 12px; margin-top: 6px; color: var(--muted); font-size: 13px; }
.stamp.big { font-size: 20px; padding: 4px 14px; border-width: 3px; transform: rotate(-6deg); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11px; color: var(--muted); margin-top: 8px; align-items: center; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: -1px; margin-right: 4px; }
svg text { fill: var(--muted); font-family: var(--font-data); font-size: 10px; }

.jobs li { padding: 6px 0; border-bottom: 1px dashed var(--line); }
.jobs { list-style: none; padding: 0; margin: 0; font-size: 14px; }
.sources { font-size: 12px; color: var(--muted); padding-left: 18px; margin: 0; display: flex; flex-direction: column; gap: 4px; }
.sources a { color: var(--accent); }

/* ── 프로젝트 ── */
.sheet.proj { gap: 12px; }
.proj .brief { font-size: 14px; color: var(--muted); }
.coach { font-size: 12.5px; line-height: 1.55; background: color-mix(in oklab, var(--accent) 8%, var(--sunk)); border: 1px solid color-mix(in oklab, var(--accent) 30%, var(--line)); border-radius: 6px; padding: 8px 10px; }
.crunch { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.crunch .seg button { padding: 6px 10px; min-height: 36px; font-size: 13px; }
.axrows { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; }
.axrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "n s" "h s" "b b"; align-items: center; gap: 2px 10px; }
.axrow .axn { grid-area: n; font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 6px; }
.axrow .xp { font-size: 11px; font-weight: 500; color: var(--muted); }
.axrow .hintb { grid-area: h; display: flex; gap: 4px; flex-wrap: wrap; }
.axrow .stepper { grid-area: s; display: flex; align-items: center; gap: 4px; }
.stepper button { width: 44px; height: 44px; border: 1px solid var(--line); background: var(--sunk); border-radius: 8px; font-size: 22px; line-height: 1; touch-action: manipulation; }
.stepper button:not(:disabled):active { transform: scale(.94); background: color-mix(in oklab, var(--accent) 14%, var(--sunk)); }
.stepper button:disabled { opacity: .35; cursor: default; }
.stepper b { min-width: 26px; text-align: center; font-size: 20px; font-weight: 800; }
.axbar { grid-area: b; height: 6px; background: var(--sunk); border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
.axbar i { display: block; height: 100%; transition: width .15s ease-out; }
.ax-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.ins { font-size: 11px; line-height: 1.5; padding: 0 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.ins.hi { border-color: var(--accent); color: var(--accent); font-weight: 700; }
.ins.mid { color: var(--ink); }
.ins.lo { border-style: dashed; }
.ins.unk { opacity: .7; }
.ins.topic { background: color-mix(in oklab, var(--accent) 14%, transparent); border-color: transparent; color: var(--accent); font-weight: 600; }
.left { font-size: 13px; color: var(--muted); } .left b { color: var(--ink); font-size: 15px; }
.btn.icon { padding: 0; width: 44px; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.workc { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
.revroom { position: relative; aspect-ratio: 160 / 64; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); margin-bottom: 10px; }
.make-label { background: color-mix(in oklab, var(--surface) 85%, transparent); padding: 2px 8px; border-radius: 4px; z-index: 1; }
.make { position: relative; aspect-ratio: 160 / 64; height: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--sunk); overflow: hidden; }
.make-label { position: absolute; left: 12px; top: 10px; font-size: 14px; font-weight: 700; }
.bub { z-index: 1; position: absolute; bottom: 14px; font-size: 11.5px; font-weight: 700; color: #fff; padding: 2px 9px; border-radius: 999px; opacity: 0; animation: bub 1.2s ease-out forwards; white-space: nowrap; box-shadow: 0 2px 6px rgba(0,0,0,.18); }
@keyframes bub { 0% { opacity: 0; transform: translateY(0) scale(.5); } 15% { opacity: 1; transform: translateY(-14px) scale(1.08); } 100% { opacity: 0; transform: translateY(-130px) scale(.95); } }
.makebar { z-index: 1; position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: var(--line); }
.makebar i { display: block; height: 100%; background: var(--accent); transform-origin: left; animation: mkfill linear forwards; }
@keyframes mkfill { from { transform: scaleX(var(--a, 0)); } to { transform: scaleX(var(--b, 1)); } }
.evcard { border: 2px solid var(--accent); border-radius: 8px; padding: 12px 14px; background: var(--surface); animation: stampin .3s ease-out; }
.evcard .ev-k { font-size: 11px; font-weight: 700; letter-spacing: .08em; color: var(--accent); }

.evcard p { margin: 0; font-size: 14px; color: var(--muted); }
.evres { margin-top: 10px; font-size: 13.5px; border-left: 3px solid var(--accent); padding: 4px 10px; display: flex; flex-direction: column; gap: 2px; opacity: 0; animation: stampin .3s ease-out forwards; }
.make ~ .evres { opacity: 1; animation: none; margin-top: 0; }
.evres b { font-size: 12px; color: var(--accent); }
.teamh { font-size: 11px; font-weight: 700; color: var(--accent); }
.axbar { display: flex; }
.axbar i.tm { opacity: .38; }
.team { border-top: 1px dashed var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 8px; }
.team-h { display: flex; flex-direction: column; gap: 2px; font-size: 14px; }
.mem { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.mem-n { display: flex; flex-direction: column; font-weight: 700; font-size: 14px; }
.mem-n .ins { align-self: flex-start; margin: 1px 0; }
.mem-ax { display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--line); background: var(--sunk); border-radius: 999px; padding: 6px 12px; min-height: 36px; font-size: 13px; white-space: nowrap; }
.revs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.rev { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--sunk); display: flex; flex-direction: column; gap: 2px; opacity: 0; animation: stampin .35s cubic-bezier(.2,1.4,.4,1) forwards; }
.rev-who { font-size: 12px; color: var(--muted); }
.rev-score { font-size: 34px; font-weight: 800; line-height: 1.05; }
.rev-score.hi { color: var(--accent); } .rev-score.lo { color: var(--stamp); }
.rev-q { font-size: 12.5px; line-height: 1.45; }
@keyframes stampin { from { opacity: 0; transform: scale(1.35) rotate(-4deg); } to { opacity: 1; transform: none; } }
.avgbox { display: flex; align-items: center; gap: 12px; margin-top: 12px; opacity: 0; animation: stampin .45s cubic-bezier(.2,1.4,.4,1) forwards; }
.avgbox b { font-size: 48px; font-weight: 800; line-height: 1; color: var(--accent); }
.verdict { font-size: 17px; font-weight: 800; color: var(--muted); border: 2px solid currentColor; border-radius: 4px; padding: 0 9px; transform: rotate(-5deg); letter-spacing: .06em; }
.verdict.hi { color: var(--accent); } .verdict.lo { color: var(--stamp); }
.gains { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12.5px; margin-top: 10px; opacity: 0; animation: stampin .3s ease-out forwards; }
.gains span { background: var(--sunk); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; }
.cmp-h { font-size: 14px; margin: 14px 0 6px; }
.cmp-h:first-child { margin-top: 10px; }
.gains .odds.up { border-color: color-mix(in oklab, var(--accent) 45%, var(--line)); color: var(--accent); font-weight: 600; }

.promo, .newins { margin-top: 10px; border-radius: 8px; padding: 10px 12px; font-size: 14px; opacity: 0; animation: stampin .4s ease-out forwards; }
.promo { background: var(--accent); color: var(--surface); font-weight: 600; }

.newins { border: 1px dashed var(--accent); display: flex; flex-direction: column; gap: 2px; }
.newins b { color: var(--accent); }
.static .rev, .static .avgbox, .static .gains, .static .promo, .static .newins, .static .evres { animation: none; opacity: 1; }
.idcard .pay .best { font-size: 12px; color: var(--muted); margin-top: 2px; white-space: nowrap; } .idcard .pay .best b { color: var(--accent); font-family: var(--font-data); }
.start-go { position: sticky; bottom: 0; z-index: 3; background: var(--bg); padding: 12px 0 calc(12px + env(safe-area-inset-bottom, 0px)); margin-block: -12px; border-top: 1px solid var(--line); }
.start-go .btn { flex: 1; max-width: 360px; }
.facts > div:last-child:nth-child(odd):not(.wide) { grid-column: 1 / -1; }
@media (min-width: 720px) { .facts > div:last-child:nth-child(odd):not(.wide) { grid-column: auto; } .facts > div:last-child:nth-child(4n+1):not(.wide) { grid-column: 1 / -1; } .facts > div:last-child:nth-child(4n+2):not(.wide) { grid-column: 2 / -1; } .facts > div:last-child:nth-child(4n+3):not(.wide) { grid-column: 3 / -1; } }
.toasts { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 10px); left: 50%; transform: translateX(-50%); z-index: 60; display: flex; flex-direction: column; gap: 6px; width: min(calc(100vw - 32px), 420px); pointer-events: none; }
.toast { background: var(--ink); color: var(--surface); border-radius: 10px; padding: 10px 14px; font-size: 14px; font-weight: 600; box-shadow: 0 8px 24px rgba(0,0,0,.25); animation: toastin .35s cubic-bezier(.2,1.3,.4,1), toastout .4s ease-in 3s forwards; }
.toast b { display: block; font-size: 11px; letter-spacing: .08em; opacity: .7; font-weight: 600; }
@keyframes toastin { from { opacity: 0; transform: translateY(-16px) scale(.96); } }
@keyframes toastout { to { opacity: 0; transform: translateY(-10px); } }
.hero { display: flex; flex-direction: column; gap: 10px; }
.hero .lede { margin-top: 4px; }
.showcase { margin: 0; }
.howto { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.howto b { display: inline-block; min-width: 56px; color: var(--accent); font-size: 12.5px; letter-spacing: .04em; }
.vault summary { cursor: pointer; font-size: 14px; font-weight: 700; }
.textlink.danger { color: var(--stamp); }
dialog.confirm { box-sizing: border-box; margin: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); padding: 22px 20px 18px; width: min(92vw, 380px); box-shadow: 0 18px 50px rgba(0,0,0,.25); }
dialog.confirm::backdrop { background: rgba(10, 12, 16, .45); }
dialog.confirm h2 { font-size: 18px; margin: 0 0 10px; }
dialog.confirm p { font-size: 14px; line-height: 1.55; margin: 0 0 8px; }
dialog.confirm .form-row { justify-content: flex-end; margin-top: 14px; gap: 8px; }
.btn.danger { background: var(--stamp); border-color: var(--stamp); color: var(--surface); }
.vault[open] { display: flex; flex-direction: column; gap: 14px; }
.achs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.achs div { border: 1px dashed var(--line); border-radius: 6px; padding: 6px 9px; font-size: 12.5px; color: var(--muted); }

.instab td, .instab th { text-align: center; padding: 5px 4px; } .instab td:first-child, .instab th:first-child { text-align: left; }
.instab .hi { color: var(--accent); font-weight: 700; } .instab .lo { color: var(--muted); } .instab .unk { color: var(--line); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .rev, .avgbox, .gains, .promo, .newins, .evres { opacity: 1; } .bub { display: none; } }

/* ── Gris 1a: 위계·정렬·컴포넌트 정리. 흰 카드 + 하단 고정 버튼 ── */
h1 { font-weight: 800; letter-spacing: -.02em; }
.label, .eyebrow { font: 600 12px/16px var(--font-body); letter-spacing: .14em; color: var(--muted); }
.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.fine { font-size: 13px; line-height: 18px; color: var(--muted); }
.stack { display: flex; flex-direction: column; gap: 12px; }
.textlink { color: var(--accent); text-decoration: none; font-weight: 500; font-size: 13px; }
.textlink:hover { color: var(--ink); }
.textlink.plain { color: var(--muted); }
.ic { display: inline-block; flex: none; vertical-align: -3px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 0 22px; border: 1px solid transparent; border-radius: var(--radius-lg); background: var(--fill-accent); color: #fff; font: 600 17px/22px var(--font-body); letter-spacing: -.01em; transition: filter .14s var(--ease), transform .08s var(--ease); }
.btn:hover:not(:disabled) { filter: brightness(.93); }

.btn.icon:hover { background: var(--fill-quiet); filter: none; }
.seg { display: inline-flex; padding: 2px; gap: 2px; border: 0; border-radius: var(--radius-md); background: var(--fill-quiet); overflow: visible; }

.seg.full button { flex: 1 1 0; }
.seg button { border: 0; background: transparent; min-height: 32px; padding: 0 12px; border-radius: 8px; font: 500 15px/20px var(--font-body); color: var(--ink); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: var(--shadow-1); }
.chips button, .focus button { border: 0; background: var(--surface); box-shadow: var(--shadow-hairline); border-radius: 999px; padding: 0 12px; min-height: 36px; font: 500 14px var(--font-body); color: var(--ink); }
.chips button:hover, .focus button:hover { box-shadow: 0 0 0 1px var(--fill-accent); }
.chips button[aria-pressed="true"], .focus button[aria-pressed="true"] { background: var(--fill-accent); color: #fff; box-shadow: none; font-weight: 600; }
.badge { --c: var(--graphite-700); display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font: 600 12px/16px var(--font-body); letter-spacing: -.01em; color: var(--c); background: color-mix(in oklab, var(--c) 14%, var(--surface)); white-space: nowrap; }
.badge.accent { --c: var(--des); } .badge.warm { --c: var(--plan); } .badge.earth { --c: var(--terre-500); } .badge.danger { --c: var(--stamp); } .badge.success { --c: var(--ok); }
.card { background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-2); }
.kv > div { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 13px 16px; font-size: 15px; }
.kv > div + div { border-top: .5px solid var(--line); }
.kv > div > span:first-child { color: var(--muted); white-space: nowrap; }
.kv b { font-weight: 600; text-align: right; }
.kv b.big { font: 700 17px var(--font-data); }
.evd summary { list-style: none; display: inline-flex; align-items: center; gap: 6px; font: 500 13px var(--font-body); color: var(--accent); cursor: pointer; min-height: 32px; }
.evd summary::-webkit-details-marker { display: none; }
.evd[open] summary { margin-bottom: 4px; }
.evidence { font-size: 12.5px; line-height: 1.6; color: var(--muted); }
/* 하단 고정 막대 (엄지 영역) */
/* 하단 막대가 있는 화면: 스크롤 영역을 화면 끝까지 넓혀 막대가 좌우로 넘치지 않게, 내용이 짧으면 막대를 바닥에 붙여 빈 스크롤이 생기지 않게 */
.app > .scroll:has(.dock) { margin-inline: -16px; padding-inline: 16px; padding-bottom: 0; overflow-x: hidden; }
.start:has(> .dock), .record:has(> .dock) { min-height: 100%; }
.dock { position: sticky; bottom: 0; z-index: 3; margin: auto -16px 0; padding: 12px 16px calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--bar-bg); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-top: .5px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.dock .btn { width: 100%; }
.bar-sub { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.bar-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
/* 시작 */
.start { gap: 18px; }
.start h1 { font: 800 34px/41px var(--font-display); letter-spacing: -.02em; white-space: nowrap; }
.challenge { font: 600 20px/25px var(--font-body); color: var(--accent); letter-spacing: -.01em; }
.start .lede { font-size: 15px; line-height: 22px; color: var(--muted); text-wrap: pretty; }
.scene { border: 0; border-radius: var(--radius-lg); }
.scene-cap { font-size: 12px; color: var(--faint); margin-top: 4px; }
.rules-card > div { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; padding: 12px 16px; font-size: 15px; line-height: 20px; }
.rules-card > div + div { border-top: .5px solid var(--line); }
.rules-card b { color: var(--accent); font-weight: 600; }
.facts { gap: 1px; background: var(--line); border: 0; border-radius: var(--radius-lg); overflow: hidden; }
.facts div { padding: 10px 14px; }
.facts b { font: 700 20px/24px var(--font-data); letter-spacing: -.02em; }
.facts span { font-size: 13px; line-height: 18px; }
.vault summary, details.manual summary, details.more > summary { font: 600 15px var(--font-body); color: var(--ink); padding: 6px 0; }
.sub-eyebrow { font: 500 13px var(--font-body); color: var(--muted); }
.track-tabs { margin-bottom: -4px; }
.track-tabs button { min-height: 36px; }
.swipe-hint { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--faint); }
@media (hover: hover) and (pointer: fine) { .swipe-hint { display: none; } }
.start.slide-next > :not(.dock) { animation: slideNext .28s var(--ease-out); }
.start.slide-prev > :not(.dock) { animation: slidePrev .28s var(--ease-out); }
@keyframes slideNext { from { transform: translateX(28px); opacity: 0; } }
@keyframes slidePrev { from { transform: translateX(-28px); opacity: 0; } }
.start.reveal { gap: 14px; }
.app > .scroll:has(> .reveal) { padding-top: 12px; }
.reveal .kv > div { padding: 11px 16px; }

.h17 { font: 600 17px/22px var(--font-body); }

.row10 { display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; }

/* 플레이: 상태 카드 */

.id-top .pay { font: 700 15px var(--font-data); white-space: nowrap; }

.idcard .meters { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 0; }
.meter { display: flex; flex-direction: column; gap: 4px; min-width: 0; }

.meter.low i::after { background: var(--brique-500); }
.id-foot { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--muted); border-top: .5px solid var(--line); padding-top: 8px; }

.app[data-screen="play"] .scene { width: 100%; height: 96px; aspect-ratio: auto; object-fit: cover; }
/* 플레이: 기록 (최신순 한 장) */
#feed { padding-block: 12px; }
.feed { gap: 0; background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-2); overflow: hidden; }

.yr-h b { font: 700 15px var(--font-data); }

.chunk + .chunk { border-top: .5px solid var(--line); padding-top: 8px; }
.ck { font: 600 11px var(--font-body); letter-spacing: .14em; color: var(--faint); }
.line { font-size: 15px; line-height: 20px; text-wrap: pretty; }
.line.big { font-weight: 500; }
.c-peer .line, .c-proj .line { font-size: 13px; line-height: 18px; color: var(--muted); }
.line.fx { font-size: 12px; color: var(--muted); }
.ev-c { color: var(--accent); }
/* 플레이: 하단 조작 막대 */

.go { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: center; }

/* 대화창 (시트) */
.sheet-wrap { background: var(--scrim); }
.sheet { border-radius: var(--radius-xl) var(--radius-xl) 0 0; box-shadow: var(--shadow-4); padding: 10px 20px calc(16px + env(safe-area-inset-bottom, 0px)); gap: 16px; }

.sh-head { display: flex; flex-direction: column; gap: 6px; }

.sheet .form-row:has(#notice-ok, #mood-save, #proj-go, #proj-done, #card-ok) { position: sticky; bottom: calc(-16px - env(safe-area-inset-bottom, 0px)); z-index: 2; background: var(--surface); margin: 0 -20px calc(-16px - env(safe-area-inset-bottom, 0px)); padding: 12px 20px calc(16px + env(safe-area-inset-bottom, 0px)); border-top: .5px solid var(--line); box-shadow: none; flex-wrap: nowrap; }
.sheet .form-row:has(#notice-ok, #mood-save, #proj-done, #card-ok) .btn { flex: 1 1 auto; }
.keystat { display: flex; align-items: baseline; gap: 10px; padding: 12px 14px; border-radius: var(--radius-md); background: var(--sunk); }
.keystat b { font: 700 22px var(--font-data); white-space: nowrap; letter-spacing: -.02em; }
.keystat span { font-size: 13px; line-height: 18px; color: var(--muted); }
.rules .rh { font: 600 12px var(--font-body); letter-spacing: .14em; color: var(--muted); padding-bottom: 6px; }
.rule { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-top: .5px solid var(--line); }

.choice .ct { flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.choice .t { font: 600 17px/22px var(--font-body); }
.choice .d { font-size: 13px; line-height: 18px; color: var(--muted); }
.fx { display: flex; gap: 6px; flex-wrap: wrap; }
.mirror { display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border-radius: var(--radius-md); background: var(--warm-soft); color: var(--warm-ink); font-size: 14px; line-height: 20px; }

.fx span { font: 500 12px/16px var(--font-data); padding: 2px 6px; border-radius: 4px; background: var(--surface); box-shadow: var(--shadow-hairline); }

.choice[aria-checked="true"], .choice.auto { background: var(--accent-soft); box-shadow: 0 0 0 2px var(--fill-accent); }
.choice[aria-checked="true"] > .ic, .choice.auto > .ic { color: var(--accent); }
.autobar { background: var(--sunk); } .autobar i { background: var(--fill-accent); }
.autonote button { border: 0; background: var(--fill-quiet); border-radius: var(--radius-md); }

.proj .brief { font-size: 15px; line-height: 20px; color: var(--muted); }

.prow { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font: 600 13px var(--font-body); }

.prow .warn { color: var(--stamp); } .prow .okc { color: var(--ok); }
.blocks { display: flex; gap: 2px; height: 10px; }

.sheet .form-row.p-actions .btn { flex: 1.3 1 0; min-width: 0; padding-inline: 10px; font-size: 16px; }
.sheet .form-row.p-actions #proj-go { flex: 2 1 0; }
.team { border-top: .5px solid var(--line); }
.mem-ax { border: 0; background: var(--fill-quiet); }
.make, .revroom { border: 0; border-radius: var(--radius-lg); }
.evcard { border: 0; box-shadow: 0 0 0 2px var(--fill-accent); border-radius: var(--radius-lg); }
.rv-score { display: flex; align-items: flex-end; gap: 12px; }

.promo { background: var(--accent-soft); color: var(--ink); border-radius: var(--radius-lg); }

.peers { display: flex; flex-direction: column; }

.peer .pp { font: 600 15px var(--font-data); }
.satline { font-size: 14px; color: var(--muted); } .satline b { color: var(--ink); }
.moodbox summary { font-size: 13px; }
/* 엔딩 기록 */
.record { gap: 20px; }
.record header { gap: 8px; }
.eyebrow.end { color: var(--stamp); }
.rec-title { font: 800 28px/34px var(--font-display); letter-spacing: -.02em; text-wrap: pretty; }
.rec-sum { font-size: 15px; line-height: 21px; color: var(--muted); }
.record .odds { border: 0; border-top: 3px solid var(--fill-accent); border-radius: var(--radius-lg); box-shadow: var(--shadow-2); background: var(--surface); padding: 16px; }

.traits { display: flex; gap: 6px; flex-wrap: wrap; }

.cat { border: 0; background: color-mix(in oklab, currentColor 12%, transparent); padding: 1px 8px; }

  for (const k in a) { if (!FX_LABEL[k] || !a[k] || (only && k !== only)) continue; const r = Math.abs(Math.log(b[k] / a[k])); if (r > .03 && (!best || r > best.r)) best = { k, a: a[k], b: b[k], r }; }

  return { kind: "fx", text: `올해 선택·성과로 ${FX_LABEL[best.k]} 가능성 ${pct(best.a, 1)} → ${pct(best.b, 1)}`, why: "초점·카드·프로젝트가 거는 배수는 게임 설계상 가정이다.", grade: "D" };
}

/* ── 1년 진행 ──
   mods: 이번 해 확률 배수 (반기 초점·카드 선택). 설계상 가정(D). 흐름대로 = 배수 없음 = 원자료 그대로. */
function step(P, mods = {}) {
  const out = [];
  if (P.end) return out;
  const r = R[P.role], roleName = ROLE[P.role];
  const { cell, fallback } = transCell(P.role, P.sex, P.age);
  const who = P.role === "planner" ? `${age3Label[age3(P.age)]} ${roleName}` : `${SEX[P.sex]} ${age3Label[age3(P.age)]} ${roleName}`;
  const cellNote = fallback && P.role !== "planner" ? " (성별 칸 표본이 30건 미만이라 남녀 합계 사용)" : "";

  if (P.status === "away") {
    P.awayYears++;
    const c = P.awayYears === 1 ? RET.other_first : RET.other_later;
    const pb = c.back * (mods.back || 1);
    const fxa = pb !== c.back ? fxLine({ back: c.back, stay: 1 - c.back }, { back: pb, stay: 1 - c.back }) : null; if (fxa) out.push(fxa);
    const why = `${SRC.klips}: ${ROLE[P.origRole]}를 떠나 다른 직업으로 일하던 사람이 다음 해 ${ROLE[P.origRole]}로 돌아온 비율 — 떠난 첫해 ${pct(c === RET.other_first ? c.back : RET.other_first.back, 1)}(${RET.other_first.n}건), 그 뒤 해마다 ${pct(RET.other_later.back, 1)}(${RET.other_later.n}건).${mods.back ? " 이번 해 선택이 이 비율에 배수를 걸었다(설계상 가정 D)." : ""}`;
    if (rand() < pb) {
      comeback(P, out, `${AWAY_NAME[P.awayKind]} 일을 정리하고 ${ROLE[P.origRole]}로 돌아왔다.`, why);
    } else if (P.awayYears >= AWAY_MAX) {
      P.end = P.awayKind === "planner" ? { type: "planner", text: `기획자로 옮긴 지 ${AWAY_MAX}년, ${ROLE[P.origRole]}로 돌아오지 않았다.` } : { type: "other", text: `${josaRo(AWAY_NAME[P.awayKind])} 옮긴 지 ${AWAY_MAX}년, ${ROLE[P.origRole]}로 돌아오지 않았다.` };
      P.jobs.at(-1).to = P.t + 1;
      out.push({ kind: "end", big: true, text: P.end.text + ` ${ROLE[P.origRole]} 커리어는 여기서 마친다.`, why: why + ` ${AWAY_MAX}년이 지나면 기록을 마친다(설계상 가정).`, grade: "B" });
    } else {
      const left = AWAY_MAX - P.awayYears;
      out.push({ kind: "away", text: `${josaRo(AWAY_NAME[P.awayKind])} 한 해를 더 일했다. ${ROLE[P.origRole]}를 떠난 지 ${P.awayYears}년, ${left === 1 ? `내년이 ${ROLE[P.origRole]}로 돌아갈 마지막 기회다.` : `돌아갈 기회가 ${left}번 남았다.`}`, why, grade: "B" });
    }
    return out;
  }
  if (P.status === "none") {
    const re = P.role === "planner" ? { back: .3, other: .3, still: .4, n: 17 } : P.noneYears <= 1 ? r.reentry : { back: RET.not_employed_later.back, other: RET.not_employed_later.other, still: RET.not_employed_later.not_employed, n: RET.not_employed_later.n };
    const w = { back: re.back * (mods.back || 1), other: re.other, still: re.still * (mods.still || 1) };
    const fxn = fxLine({ back: re.back, other: re.other, still: re.still }, w); if (fxn) out.push(fxn);
    const k = pick(w);
    const why = `${SRC.klips}: 일을 쉬던 ${roleName}의 다음 해 상태 ${re.n}건(${P.noneYears <= 1 ? "쉰 첫해" : "쉰 지 2년 이상"}) 중 같은 일 복귀 ${pct(re.back)}, 다른 일 ${pct(re.other)}, 계속 쉼 ${pct(re.still)}.`;
    if (k === "back") {
      const gapY = P.noneYears;
      P.size = pick(G.size_move[P.size]); P.company = choose(COMPANY[P.role][P.size]); P.status = "wage"; P.noneYears = 0;
      P.jobs.push({ company: P.company, size: P.size, role: P.role, from: P.t + 1, to: null, kind: "wage" });
      out.push({ kind: "back", big: true, text: `공백 ${gapY}년 만에 ${roleName}로 다시 일을 시작했다. ${P.company}, ${SIZE3[P.size]}.`, why, grade: "B", notice: { type: "work", from: "none", gap: gapY, rate: re.back } });
    } else if (k === "other") {
      const dest = r.dest ? pick(r.dest) : "other";
      goAway(P, dest, null);
      out.push({ kind: "leave_role", big: true, text: `공백기 끝에 ${josaRo(AWAY_NAME[dest])} 일을 시작했다. ${AWAY_MAX}년 안에 ${ROLE[P.origRole]}로 돌아오지 않으면 게임이 끝난다.`, why, grade: "B" });
    } else {
      P.noneYears++;
      if (P.noneYears >= BREAK_MAX) {
        P.end = { type: "break", text: `공백이 ${BREAK_MAX}년째 이어졌다. 기록은 여기서 멈춘다.` };
        out.push({ kind: "end", big: true, text: P.end.text, why: why + ` 공백 ${BREAK_MAX}년째를 종료로 보는 것은 게임 설계상 가정이다.`, grade: "D" });
      } else {
        const left = BREAK_MAX - P.noneYears;
        out.push({ kind: "still", big: true, text: `올해도 일자리를 구하지 못했다. 공백 ${P.noneYears}년째. ${left === 1 ? "내년에도 쉬면 게임이 끝난다." : `복귀 기회가 ${left}번 남았다.`}`, why, grade: "B" });
      }
    }
    return out;
  }

  const w = {
    same_job: cell.same_job * (mods.same_job || 1),
    new_job_same_occupation: cell.new_job_same_occupation * (mods.new_job_same_occupation || 1),
    other_occupation: cell.other_occupation * mEff(P) * (mods.other_occupation || 1),
    not_employed: cell.not_employed * mEff(P) * (mods.not_employed || 1) * (P.energy < 20 ? 1.5 : 1),
  };
  const w0 = { same_job: cell.same_job, new_job_same_occupation: cell.new_job_same_occupation, other_occupation: cell.other_occupation * mEff(P), not_employed: cell.not_employed * mEff(P) * (P.energy < 20 ? 1.5 : 1) };
  const ts = P.status === "wage" && mods.to_self ? { k: "to_self", a: selfRate(P), b: selfRate(P) * mods.to_self } : null;
  const k = pick(w);
  const fxw = fxLine(w0, w, ts, k === "same_job" ? null : k); if (fxw) out.push(fxw);
  const base = `${SRC.klips}: ${who}의 다음 해 상태 ${cell.n}건${cellNote} — 같은 직장 ${pct(cell.same_job, 1)}, 같은 직군 이직 ${pct(cell.new_job_same_occupation, 1)}, 다른 직업 ${pct(cell.other_occupation, 1)}, 쉼 ${pct(cell.not_employed, 1)}.`;
  const modNote = Object.keys(mods).length ? " 이번 해 선택이 이 비율에 배수를 걸었다(설계상 가정 D)." : "";
  const quitWhy = (skip = []) => {
    const src = R[P.role === "planner" ? "designer" : P.role];
    const q = pick(Object.fromEntries(Object.entries(src.quit).filter(([k]) => !skip.includes(k))));
    return { q, note: ` 떠난 이유는 ${SRC.yp} 퇴사 ${src.quit_n}건의 사유 분포에서 뽑았다: "${q}" ${pct(src.quit[q], 1)}.` };
  };

  if (k === "same_job") {
    if (P.status === "wage" && rand() < selfRate(P) * (mods.to_self || 1)) {
      P.status = "self"; P.selfNoise = Math.exp(0.3 * normal());
      P.jobs.at(-1).to = P.t + 1;
      P.jobs.push({ company: "프리랜서", size: null, role: P.role, from: P.t + 1, to: null, kind: "self" });
      out.push({ kind: "self", big: true, text: `회사를 나와 프리랜서 ${roleName}로 독립했다.`, why: `${SRC.klips}: 같은 직군에 남은 임금근로 ${roleName}가 다음 해 자영업이 되는 비율 연 ${pct(r.to_self, 1)}. 나이가 들수록 자영업 비중이 커지는 노동패널 분포(30대 초 9%, 30대 후반 29%, 50대 45~57%)에 맞춰 이 나이대에는 연 ${pct(selfRate(P), 1)}로 두었다(보정).${modNote}`, grade: "B" });
    } else if (P.status === "self" && rand() < (r.self_to_wage || 0) * (mods.self_to_wage || 1)) {
      P.status = "wage"; P.size = pick({ S: .65, M: .21, L: .14 }); P.company = choose(COMPANY[P.role][P.size]);
      P.jobs.at(-1).to = P.t + 1;
      P.jobs.push({ company: P.company, size: P.size, role: P.role, from: P.t + 1, to: null, kind: "wage" });
      out.push({ kind: "back", big: true, text: `프리랜서를 접고 ${P.company}(${SIZE3[P.size]})에 들어갔다.`, why: `${SRC.klips}: 자영업 ${roleName}가 다음 해 임금근로로 돌아가는 비율 연 ${pct(r.self_to_wage, 1)}. 규모는 소규모 출발 행을 썼다.`, grade: "B", notice: { type: "work", from: "self", rate: r.self_to_wage } });
    } else {
      // 이직자 웃돈만큼 남은 사람은 조금 덜 올라, 평균은 나이별 곡선에 머문다
      if (P.status === "wage") P.p *= 1 - jobBump(P.role) * cell.new_job_same_occupation;
      if (P.status === "self") P.selfNoise = Math.max(.4, Math.min(2.2, P.selfNoise * Math.exp(0.2 * normal())));
      out.push({ kind: "stay", text: P.status === "self" ? "프리랜서로 한 해를 보냈다." : `${P.company}에서 한 해를 더 보냈다.`, why: base + modNote, grade: "B" });
    }
  } else if (k === "new_job_same_occupation") {
    const { q, note } = quitWhy();
    const from = P.size;
    P.size = pick(G.size_move[P.size]); P.company = choose(COMPANY[P.role][P.size]);
    const bump = jobBump(P.role);
    P.p *= Math.exp(Math.log(1 + bump + (mods.bonus || 0)) + 0.08 * normal());
    if (P.status === "self") P.status = "wage";
    const g = R[P.role === "planner" ? "designer" : P.role].gap;
    const gk = pick({ a: g.le1, b: g["2to6"], c: g.gt6 });
    const gap = Math.round(gk === "a" ? rand() * 1.4 : gk === "b" ? 2 + rand() * 4 : 7 + rand() * 5);
    P.jobs.at(-1).to = P.t + 1;
    P.jobs.push({ company: P.company, size: P.size, role: P.role, from: P.t + 1, to: null, kind: "wage", reason: q });
    out.push({
      kind: "move", big: true,
      text: `${QUIT_TEXT[q] || q} ${josaRo(P.company)} 옮겼다(${SIZE3[P.size]}).${gap >= 2 ? ` 사이에 ${gap}개월을 쉬었다.` : ""}`,
      why: base + note + ` 새 회사 규모는 ${SRC.size}에서 ${SIZE3[from]} 출발 행으로 뽑았다. 이직하면 월급이 같은 직장에 남은 사람보다 약 ${pct(bump, 1)} 더 오른다(${SRC.klips} 연간 변화 중앙값 차이).${modNote}`,
      grade: "B",
    });
  } else if (k === "other_occupation") {
    const { q, note } = quitWhy();
    const dest = r.dest ? pick(r.dest) : "other";
    const destWhy = r.dest ? ` 다른 직업으로 옮긴 ${roleName} ${r.dest_n}명의 도착지: 개발자 ${pct(r.dest.developer || 0)}, 디자이너 ${pct(r.dest.designer || 0)}, 기획자 ${pct(r.dest.planner || 0)}, 그 밖 ${pct(r.dest.other)}.` : "";
    const co = P.status === "self" ? "프리랜서" : P.company, rate = cell.other_occupation * mEff(P);
    goAway(P, dest, q);
    out.push({ kind: "leave_role", big: true, text: `${QUIT_TEXT[q] || q} ${roleName} 일을 내려놓고 ${josaRo(AWAY_NAME[dest])} 옮겼다.`, why: base + note + destWhy + modNote, grade: "B",
      notice: { type: "away", q, dest, co, rate } });
  } else {
    const wasSelf = P.status === "self", co = P.company;
    P.status = "none"; P.noneYears = 1; P.jobs.at(-1).to = P.t + 1;
    // 노동패널에는 쉬게 된 이유가 없다. 최근 2년 안에 아이가 태어났으면 육아로, 아니면 청년패널 퇴사 사유에서 뽑는다(창업 제외). 설계상 가정.
    const baby = P.kids.some((k) => P.t - k <= 1);
    const { q, note } = baby ? { q: "육아·가사", note: " 최근 아이가 태어나 쉬는 이유를 육아로 두었다(설계상 가정 D)." } : quitWhy(["창업·개인사업"]);
    P.jobs.at(-1).reason = q;
    let why = base + modNote + " 노동패널에는 일을 쉬게 된 이유가 없어, 이유는 따로 붙였다." + note;
    if (P.sex === "female") why += " 참고: 2024년 경력단절여성의 사유는 육아 41.1%, 결혼 24.9%, 임신·출산 24.4% (KOSIS 지역별고용조사).";
    const lost = q === "폐업·해고·사업종료" || q === "계약 만료";
    const what = wasSelf ? "프리랜서 일을 접었다" : lost ? "일자리를 잃었다" : "회사를 그만뒀다";
    out.push({ kind: "none", big: true, text: `${QUIT_TEXT[q] || q} ${what}. 다음 일자리는 아직 없다.`, why, grade: "C",
      notice: { type: "none", q, what, lost, wasSelf, co, rate: cell.not_employed, back: r.reentry ? r.reentry.back : null } });
  }
  return out;
}
/* 회사 → 프리랜서 연간 확률. 노동패널 연 1.0%에 나이대별 배수를 곱해, 나이대별 자영업 비중(노동패널)에 맞춘다(export_game_data.py SELF_AGE) */
const selfKey = (age) => age < 30 ? "~29" : age < 35 ? "30~34" : age < 40 ? "35~39" : age < 45 ? "40~44" : age < 50 ? "45~49" : "50+";
function selfRate(P) { const r = R[P.role]; return (r.to_self || 0) * ((r.self_age_mult || {})[selfKey(P.age)] || 1); }
function jobBump(role) { return role === "developer" ? 0.088 : role === "designer" ? 0.077 : 0.03; }
function advanceAge(P) {
  P.t += 1; P.age += 1;
  // 60세에 디자이너로 일하고 있을 때만 정년. 다른 직업이나 공백 중이면 그 상태로 끝난다
  if (!P.end && P.age >= RETIRE_AGE) P.end = P.status === "away" ? { type: P.awayKind === "planner" ? "planner" : "other", age60: true, text: `${RETIRE_AGE}세, ${josaRo(AWAY_NAME[P.awayKind] || "다른 직업")} 일하던 중에 기록을 마쳤다.` }
    : P.status === "none" ? { type: "break", age60: true, text: `${RETIRE_AGE}세, 일을 쉬던 중에 기록을 마쳤다.` }
    : { type: "retire", text: `${RETIRE_AGE}세가 되어 기록을 마쳤다.` };
}

/* ── 같은 조건 5,000명 미리 굴리기 (체크포인트·검증용, 흐름대로) ── */
const MC = {};
function cohort(role, sex) {
  const key = role + sex;
  if (MC[key]) return MC[key];
  const N = 5000, T = 41, keep = Array(T).fill(0), wages = Array.from({ length: T }, () => []), earn = [], ends = [], ageBins = [0, 0, 0, 0];
  const BANDS5 = [25, 30, 35, 40, 45, 50], bandN = BANDS5.map(() => [0, 0]);
  for (let i = 0; i < N; i++) {
    const P = newPerson(role, sex);
    const hist = {};
    let tot = 0, dy = 0;
    for (let t = 0; t < T; t++) {
      if (t > 0) { const w0 = currentWage(P); step(P); advanceAge(P); tot += (!P.end || P.end.type === "retire" ? currentWage(P) : w0) * 12; }
      const inRole = !P.end && WORKING.includes(P.status) && P.role === role;
      if (t > 0 && WORKING.includes(P.status) && (!P.end || P.end.type === "retire")) dy++;
      hist[P.age] = inRole;
      if (inRole) { keep[t]++; wages[t].push(currentWage(P)); if (P.age < 60) ageBins[P.age < 30 ? 0 : P.age < 40 ? 1 : P.age < 50 ? 2 : 3]++; }
      if (P.end) break;
    }
    // 나이대별 5년 유지: 그 나이대에 처음 그 직군이던 해부터 5년 뒤 (노동패널과 같은 정의)
    BANDS5.forEach((b, j) => { let a0 = null; for (let a = b; a < b + 5; a++) if (hist[a]) { a0 = a; break; } if (a0 !== null && a0 + 5 <= 59) { bandN[j][0]++; if (hist[a0 + 5]) bandN[j][1]++; } });
    earn.push(tot);
    ends.push({ type: P.end ? P.end.type : "retire", years: dy, same: P.role === role, back: P.flags.comeback || 0 });
  }
  MC[key] = { keep: keep.map((k) => k / N), wages: wages.map((w) => w.sort((a, b) => a - b)), earn: earn.sort((a, b) => a - b), ends, N, band: bandN.map(([n, k]) => (n ? k / n : 0)), age: ageBins.map((x) => x / ageBins.reduce((a, b) => a + b, 0)) };
  return MC[key];
}
function percentile(sorted, x) { if (!sorted.length) return null; let lo = 0; while (lo < sorted.length && sorted[lo] < x) lo++; return lo / sorted.length; }

/* ── 반기 초점 (게임에서는 1년 초점) ── */
const FOCUS = {
  flow: { label: "흐름대로", hint: "애쓰지 않고 통계 그대로 한 해를 보낸다. 에너지가 조금 찬다.", mods: {}, energy: 6, skill: 2 },
  work: { label: "지금 일에 집중", hint: "프로젝트 점수가 조금 오르고, 지금 회사에 조금 더 오래 남게 된다. 지친다.", mods: { same_job: 1.15 }, energy: -4, skill: 4 },
  grow: { label: "실력 키우기", hint: "실력과 영역 경험이 크게 쌓이고, 다음에 이직할 때 월급이 더 오른다. 조금 지친다.", mods: { bonus: 0.03 }, energy: -3, skill: 8 },
  move: { label: "이직 준비", hint: "다른 회사로 옮길 가능성이 두 배가 된다. 조금 지친다.", mods: { new_job_same_occupation: 2 }, energy: -3, skill: 3 },
  side: { label: "사이드·외주", hint: "프리랜서로 독립할 가능성이 커지지만, 다른 직업으로 옮길 가능성도 조금 커진다. 많이 지친다.", mods: { to_self: 3, other_occupation: 1.2 }, energy: -8, skill: 5 },

function marryP(P) {

function birthP(P) {

}

/* ── 장면 (픽셀아트, 코드로 그린다) ──
   지금 상태(회사 규모·프리랜서·쉼·육아휴직·다른 직업)에 맞는 장소를 고르고,
   계절·시간·가족·반려동물·피로·카드 종류를 얹는다. 192×60 논리 픽셀을 늘려 그린다. */

  const wrap = (t, x, y, maxW, size, color, lh, w = 500) => { g.font = `${w} ${size}px ${F}`; g.fillStyle = color; g.textAlign = "left"; let line = ""; for (const wd of t.split(" ")) { const next = line ? line + " " + wd : wd; if (line && g.measureText(next).width > maxW) { g.fillText(line, x, y); y += lh; line = wd; } else line = next; } if (line) g.fillText(line, x, y); return y + lh; };
  txt(`커리어 기록부 · ${START_YEAR}–${START_YEAR + P.t - 1}`, 100, 150, 30, C.muted, 500);
  let y = wrap(title, 100, 230, 880, 64, C.ink, 80, 800);

  // 도장
  g.save(); g.translate(850, y + 92); g.rotate(-0.12); g.strokeStyle = C.stamp; g.lineWidth = 6; g.font = `800 40px ${F}`; const sw = g.measureText(STAMP[P.end.type]).width + 44; g.strokeRect(-sw / 2, -36, sw, 72); g.fillStyle = C.stamp; g.textAlign = "center"; g.fillText(STAMP[P.end.type], 0, 14); g.restore();
  // 큰 숫자 (도장은 오른쪽)
  y += 40;
  txt(`${sp.me}년`, 100, y + 90, 120, C.acc, 800);
  txt(`${JOB()}로 일한 시간 · 오래 일한 순서로 ${topPct(sp.below)}`, 100, y + 145, 32, C.ink, 600);
  // 분포 막대
  const cx = 100, cw = 880, ch = 300, cy = y + 200, n = sp.bins.length, bw = cw / n, top = Math.max(...sp.bins);
  sp.bins.forEach((v, i) => { const h = v / top * (ch - 40); g.fillStyle = i === sp.me ? C.acc : C.bar; g.fillRect(cx + i * bw + 1, cy + ch - h, Math.max(2, bw - 3), h); });
  g.strokeStyle = C.line; g.lineWidth = 2; g.beginPath(); g.moveTo(cx, cy + ch + 1); g.lineTo(cx + cw, cy + ch + 1); g.stroke();
  for (let t = 0; t < n; t += 5) txt(`${t}년`, cx + (t + .5) * bw, cy + ch + 40, 24, C.muted, 500, "center");
  const mx = cx + (sp.me + .5) * bw; txt("나", mx, cy + ch - (sp.bins[sp.me] / top) * (ch - 40) - 14, 30, C.acc, 800, "center");
  txt(`같은 조건 ${sp.N.toLocaleString()}명이 ${JOB()}로 일한 햇수 · 중간값 ${sp.median}년`, 100, cy + ch + 90, 26, C.muted, 500);

  txt(`${JOB()}로 살아보기`, 100, 1250, 34, C.acc, 800);

}

    const r = R[g];
    const both = (t) => { const f = cohort(g, "female").keep[t], m = cohort(g, "male").keep[t]; return f * r.female_share + m * (1 - r.female_share); };
    const f = cohort(g, "female"), m = cohort(g, "male");
    const age = f.age.map((x, i) => x * r.female_share + m.age[i] * (1 - r.female_share));
    const band = f.band.map((x, i) => x * r.female_share + m.band[i] * (1 - r.female_share));
    return { g, r, sim: [1, 3, 5, 10, 12, 15].map(both), obs: ["1y", "3y", "5y", "10y", "12y", "15y"].map((k) => r.keep_young[k]), age, band, bandObs: ["25", "30", "35", "40", "45", "50"].map((k) => r.keep_band[k]) };
  });
  const tr = (g, sex) => ["~34", "35~44", "45+"].map((a) => { const c = R[g].trans[sex][a]; return `<td class="r num">${pct(c.same_job, 0)} / ${pct(c.new_job_same_occupation, 0)} / ${pct(c.other_occupation, 0)} / ${pct(c.not_employed, 0)}<br><span class="fine">n=${c.n}</span></td>`; }).join("");
  $app.innerHTML = `<div class="scroll"><div class="record">
    <header><div class="label">데이터와 출처</div><h1 style="font-size:26px">이 게임이 굴리는 숫자</h1>
      <p class="fine">모든 수치는 원자료에서 직접 계산했고 비가중입니다. 등급: A 공식 통계, B 대리 지표·패널 원자료, C 설문·대리 직군, D 설계 가정.</p></header>
    <section><h2>해마다의 다음 해 상태 (노동패널, B)</h2>
      <p class="fine">같은 직장 / 같은 직군 이직 / 다른 직업 / 쉼. 성별 칸 표본이 30건 미만이면 남녀 합계를 씁니다.</p>
      <div class="tw"><table><thead><tr><th></th><th class="r">34세 이하</th><th class="r">35~44세</th><th class="r">45세 이상</th></tr></thead><tbody>
      ${PLAY.flatMap((g) => ["female", "male"].map((sx) => `<tr><td>${SEX[sx]} ${ROLE[g]}</td>${tr(g, sx)}</tr>`)).join("")}
      </tbody></table></div></section>
    <section><h2>검증: 같은 직군에 남는 비율</h2>
      <p class="fine">게임 엔진으로 성별마다 5,000명을 굴려(흐름대로) 실제 관찰값과 비교했습니다. 관찰값은 노동패널에서 30세 이하에 처음 그 직군으로 관찰된 사람이 k년 뒤에도 같은 직군인 비율입니다(그 해 패널에 남은 사람 기준). 노동패널은 2009~2024년이라 15년이 넘는 기간은 관찰값이 없고, 게임은 그 뒤를 같은 확률표로 이어 갑니다.</p>
      <div class="tw"><table><thead><tr><th></th><th class="r">1년</th><th class="r">3년</th><th class="r">5년</th><th class="r">10년</th><th class="r">12년</th><th class="r">15년</th></tr></thead><tbody>
      ${rows.map((x) => `<tr><td>${ROLE[x.g]} 게임</td>${x.sim.map((v) => `<td class="r num">${pct(v)}</td>`).join("")}</tr><tr><td>${ROLE[x.g]} 노동패널</td>${x.obs.map(([v, n]) => `<td class="r num">${pct(v)}<br><span class="fine">n=${n}</span></td>`).join("")}</tr>`).join("")}
      </tbody></table></div></section>
    <section><h2>검증: 나이대별 5년 뒤 같은 직군</h2>
      <p class="fine">그 나이대에 그 직군이던 사람이 5년 뒤에도 같은 직군인 비율입니다. 15년이 넘는 기간은 한 사람을 끝까지 따라간 관찰값이 없어서, 30대 이후에 얼마나 남는지는 이 표로 잡았습니다.</p>
      <div class="tw"><table><thead><tr><th></th><th class="r">25~29세</th><th class="r">30~34세</th><th class="r">35~39세</th><th class="r">40~44세</th><th class="r">45~49세</th><th class="r">50~54세</th></tr></thead><tbody>
      ${rows.map((x) => `<tr><td>${ROLE[x.g]} 게임</td>${x.band.map((v) => `<td class="r num">${pct(v)}</td>`).join("")}</tr><tr><td>${ROLE[x.g]} 노동패널</td>${x.bandObs.map(([v, n]) => `<td class="r num">${pct(v)}<br><span class="fine">n=${n}</span></td>`).join("")}</tr>`).join("")}

      <p class="fine" style="margin-top:6px">보정: 위 두 표에 함께 맞춰, 다른 직업으로 옮기거나 일을 쉬는 해마다의 확률에 디자이너 ×${R.designer.hetero.mean}, 개발자 ×${R.developer.hetero.mean}을 곱했습니다(prototype/calibrate.js). 10·12·15년 관찰값은 거의 같은 사람들이고 표본이 작아 무게를 낮췄습니다. 그래서 60세까지 처음 직군으로 남는 비율은 대략 디자이너 3~10%, 개발자 20~30% 범위로 보는 게 맞습니다.</p></section>
    <section><h2>참고: 일하는 사람의 나이 분포</h2>
      <p class="fine">게임은 처음 직군으로 들어온 사람만, 매년 같은 수가 들어온다고 보고 굴린 분포입니다. 노동패널은 2020~2024년 그 직군 취업자(60세 미만)입니다. 실제 30~40대에는 다른 일을 하다 중간에 들어오거나 돌아온 사람이 섞여 있어서, 게임보다 나이 든 쪽이 두껍습니다. 그래서 이 표는 보정 목표로 쓰지 않았습니다.</p>
      <div class="tw"><table><thead><tr><th></th><th class="r">30세 미만</th><th class="r">30대</th><th class="r">40대</th><th class="r">50대</th></tr></thead><tbody>
      ${rows.map((x) => `<tr><td>${ROLE[x.g]} 게임</td>${x.age.map((v) => `<td class="r num">${pct(v)}</td>`).join("")}</tr><tr><td>${ROLE[x.g]} 노동패널</td>${x.r.age_dist.share.map((v) => `<td class="r num">${pct(v)}</td>`).join("")}</tr>`).join("")}
      </tbody></table></div></section>
    <section><h2>첫 직장과 월급</h2><div class="tw"><table><thead><tr><th></th><th class="r">디자이너</th><th class="r">개발자</th></tr></thead><tbody>
      ${[["한 해 첫 출근 추정 (청년패널 가중치, 1993~1996년생)", (g) => ROLE_W[g].toLocaleString("ko-KR") + "명"], ["첫 직장 관찰 수 (청년패널)", (g) => R[g].weight], ["남 : 여 비율", (g) => mfRatio(R[g].female_share)],
        ["첫 월급 중앙값 여성 / 남성", (g) => `${won(R[g].first_wage.female)} / ${won(R[g].first_wage.male)}`], ["첫 직장 30명 미만", (g) => pct(R[g].first_size9["1~4"] + R[g].first_size9["5~9"] + R[g].first_size9["10~29"])],
        ["나이별 월급 중앙값 45~49세 (노동패널)", (g) => won(R[g].wage_by_age["45~49"])], ["성별 월급 배수 여성 / 남성 (25~44세)", (g) => `${R[g].sex_wage_ratio.female} / ${R[g].sex_wage_ratio.male}`],
        ["다른 직업으로 옮긴 사람의 도착지: 상대 직군 / 기획자", (g) => `${pct(R[g].dest[g === "designer" ? "developer" : "designer"] || 0)} / ${pct(R[g].dest.planner || 0)}`],
        ["떠난 첫해 돌아오는 비율 (노동패널)", (g) => `${pct(G.ret[g].other_first.back, 1)} (n=${G.ret[g].other_first.n})`]].map(([lab, f]) => `<tr><td>${lab}</td><td class="r num">${f("designer")}</td><td class="r num">${f("developer")}</td></tr>`).join("")}
      </tbody></table></div>
      <p class="fine" style="margin-top:6px">월급은 노동패널 나이별 곡선(2009~2024년 합산, 물가 보정 전)의 모양에 청년패널 첫 월급 수준을 맞춘 값입니다. 사람마다 ±25% 정도 차이(로그정규)를 두었고, 이 폭은 설계상 가정입니다. 회사 규모별 배수는 노동패널 25~44세에서 계산했습니다.</p></section>
    <section><h2>디자이너·개발자와 일반 직장인</h2>
      <p class="fine">회사 생활 카드의 근거입니다. 노동패널 2022~2024년 조사, 20~59세 임금근로자 사람-해 단위, 비가중. 디자이너(KSCO 285)는 ${WK.designer.n}건, 개발자(KSCO 222·223)는 ${WK.developer.n}건입니다(같은 사람이 여러 해 들어 있음). 디자이너는 표본이 작아 오차가 큽니다. 만족은 '매우 만족·만족' 비율입니다.</p>
      <div class="tw"><table><thead><tr><th></th><th class="r">임금근로자 전체</th><th class="r">디자이너</th><th class="r">개발자</th></tr></thead><tbody>
      ${[["정규직", (g) => WK[g].regular.p], ["지금 직장 근속 중앙값", (g) => WK[g].tenure_median + "년"], ["초과근로가 있다", (g) => WK[g].overtime.p], ["초과근로 수당을 못 받는다 (초과근로자 중)", (g) => g !== "all" ? `${pct(WK[g].overtime_unpaid.p)} (n=${WK[g].overtime_unpaid.n})` : WK[g].overtime_unpaid.p],
         ["성과급제가 있다", (g) => WK[g].performance_pay.p], ["직장에 노조가 있다", (g) => WK[g].union_exists.p],
         ...["임금", "고용안정", "일의 내용", "근로시간", "발전가능성", "인간관계", "인사고과 공정성", "복리후생", "일자리 전반"].map((k) => [`만족: ${k}`, (g) => WK[g].job_sat[k].sat.p]),
         ["만족: 여가활동", (g) => WK[g].life_sat["여가활동"].sat.p], ["스스로 건강하다", (g) => WK[g].healthy.p], ["주 1회 이상 음주", (g) => WK[g].drink_weekly.p], ["흡연", (g) => WK[g].smoke.p]]
        .map(([lab, f]) => `<tr><td>${lab}</td>${["all", "designer", "developer"].map((g) => { const v = f(g); return `<td class="r num">${typeof v === "number" ? pct(v) : v}</td>`; }).join("")}</tr>`).join("")}

      <p class="fine" style="margin-top:6px">공식 통계로 만든 카드: 첫 일자리 평균 근속 1년 6.4개월(청년층 부가조사 2025), 가장 오래 다닌 일자리를 그만둔 나이 52.9세(고령층 부가조사 2025), 직장 내 괴롭힘 경험·목격 28.8%(고용노동부 2024 실태조사), 출퇴근 왕복 73.9분(통계청 2024 통근 분석, 실험 통계), 아빠 육아휴직 시점(육아휴직통계).</p></section>
    <section><h2>결혼·출산·이혼</h2>
      <p class="fine">결혼은 노동패널에서 올해 미혼인 사람이 다음 해 기혼인 비율입니다(성별 × 2세 단위 나이, 직군 무관). 결혼한 사람이 조사에서 빠지는 탓에 낮게 잡혀, 2020 인구총조사 30대 미혼율(남 50.8%, 여 33.6%)에 맞게 남 ×${G.life.marry_scale.male}, 여 ×${G.life.marry_scale.female}를 곱했습니다. 그 결과 게임 속 평균 첫 결혼 나이는 남 33.0세, 여 30.7세입니다(통계청 2024: 33.9세, 31.6세). 결혼 확률은 표본이 있는 49세까지만 씁니다. 아래 표는 배수를 곱한 뒤의 값입니다.</p>

      <p class="fine" style="margin-top:6px">출산은 결혼 다음 해부터 첫째 연 30%(3년까지), 12%(6년까지), 이후 3%, 둘째는 첫째 다음 해부터 4년간 연 13%로 두었습니다. 통계청 2024년 출생통계의 첫째 33.1세·둘째 34.4세에 맞춘 값이고, 게임 속 여성은 첫째 32.9세, 둘째 34.5세, 1인당 아이 0.94명입니다. 2024년 합계출산율 0.75명보다는 조금 많습니다(등급 C). 이혼·별거는 노동패널 기혼자의 연간 비율 ${pct(G.life.divorce.female["35~44"], 2)}~${pct(G.life.divorce.male["~34"], 2)}를 그대로 씁니다. 육아휴직을 쓸지는 플레이어가 고르고, 카드에 2023년 실제 사용률(엄마 84.5%, 아빠 16.1%)을 보여 줍니다.</p></section>

    <section><h2>설계상 가정 (D)</h2><ul class="sources" style="list-style:disc">
      <li>한 턴은 1년입니다. PRD의 반기 턴은 연간 자료를 그대로 쓰기 위해 1년으로 바꿨습니다.</li>
      <li>프로젝트: 프로젝트 유형 ${Object.keys(PTYPES).length}종과 업계 ${Object.keys(TOPICS).length}종의 '맞는 배분', 리뷰 점수 공식, 직급 조건(일한 햇수·평판), 승진 때 월급 +3%. 대표 프로젝트는 일하는 동안 2년에 하나이고, 리뷰 점수는 그해와 다음 해 두 번 반영됩니다. 리뷰 평균이 8점 이상이면 그해 다른 직업으로 옮길 확률 ×0.75·쉬게 될 확률 ×0.85, 4점 이하면 ×1.3·×1.2. 평판은 이직 확률에 ×0.9~1.3, 떠나 있는 동안 최고 리뷰 점수는 복귀 확률에 ×0.8~1.25를 겁니다. 점수에 따른 월급 변화는 해마다 ±2% 안쪽입니다. 확률표 자체는 노동패널 그대로입니다.</li>
      <li>돌발 상황과 팀: 돌발 상황 ${PEV.length}종의 발생 확률(프로젝트의 약 55%, 첫 프로젝트 제외), 선택지별 효과, 경험에 따른 성공 확률(25~92%). 리드 2명·디렉터 3명의 팀 규모, 팀원의 기여 시간·성장·의욕·이탈 규칙.</li>
      <li>올해의 초점이 거는 확률 배수(쉬거나 다른 직업으로 일하는 동안의 적극 지원 ×2, 포트폴리오 정비 ×1.4 포함), 일하는 동안 일·회사·성장 카드를 1.6배 자주 뽑는 비중, 이번 판 목표의 행복 기준(평균 만족도 ${HAPPY}), 사건 카드 ${CARD_N}종의 내용과 효과, 에너지·실력·만족도 계산. 사건은 한 판에서 한 번씩만 나옵니다. 근거 통계가 있는 카드는 '왜?'에 출처와 함께 등급 C로 표시했습니다.</li>
      <li>육아휴직 뒤 원래 직장 복귀, 석사 뒤 월급 +3~6%, 수입·지출 카드의 금액(작은 결혼식 500만 원, 석사 등록금 1,600만 원 등).</li>
      <li>자산: 해마다 실수령 − 생활비 − 경조사비 + 카드 금액 − 주담대 원리금·반복 지출 + 예금 이자 + 퇴직금. 생활비는 신한은행 보통사람 금융생활 보고서 2024의 생애 단계(20대 미혼, 3040대 미혼, 기혼 무자녀, 자녀 나이별 기혼 5개 그룹)와 소득 5구간별 소득 운용에서, 저축·투자 비중(12~31%)과 부채상환 비중(5~19%)의 절반만 자산으로 남고 나머지(소비·예비자금)는 쓴다고 보고 내 소득에 맞춰 보간한 값이고, 최저선은 그 그룹 하위 20%의 월 소비액(69~242만 원)입니다. 경조사는 같은 보고서의 나이대별 연 참석 횟수(2.2~5.8회) × NH농협은행 축의금 평균 11만 7천 원. 결혼식은 한국소비자원 평균 2,156만 원의 절반. 설계상 가정: 부채상환의 절반은 원금(집 지분)으로 남고 예비자금은 결국 쓴다고 본 것, 기혼은 배우자도 나만큼 번다고 보고 가구 소득으로 비중을 찾되 생활비는 절반만 내 몫, 소득세 근사(월 250만 이하 1%~600만 초과 10%), 반려동물 월 10만 원, 투자 수익(주식 등)·물가 보정 없음. 예금 이자·퇴직금·집·대출은 '큰돈' 표의 근거를 따른다. 자산은 현금 + 집값 − 대출이고, 기혼은 집·자녀·차 비용을 배우자와 반씩 낸다고 본다. 4대보험 근로자 부담 약 9.4%는 2025 요율.</li>
      <li>60세 종료, 공백 ${BREAK_MAX}년째 종료, 다른 직업 ${AWAY_MAX}년 종료, 쉬게 된 이유(노동패널에 없어 청년패널 퇴사 사유나 최근 출산으로 붙임), 회사 이름 예시.</li>
      <li>'통계 확률로 일어난 일'(교통사고, 우울증·공황장애·탈모 진료)은 전국 한 해 인원을 인구 약 5,120만 명으로 나눈 확률을 모든 나이에 똑같이 씁니다. 우울증은 한 해 진료받은 사람 수라 새로 걸리는 확률보다 높게 잡혔을 수 있고, 에너지가 35 아래면 ×1.5로 두었습니다.</li>
      <li>회사를 나와 프리랜서가 되는 확률: 노동패널 연 1.0%에 나이대별 배수(20대 ×3.3, 30대 초 ×1, 35~49세 ×7.5, 50세 이상 ×13.8)를 곱했습니다. 실제로는 다른 일을 하다 프리랜서 디자이너로 들어오는 사람이 많은데, 게임은 신입으로 들어온 사람만 따라가기 때문에 이 배수로 나이대별 자영업 비중(노동패널: 30대 초 9%, 35~49세 평균 27%, 50대 48%)을 맞췄습니다.</li>
      <li>첫 월급의 개인차(같은 회사 규모 안 로그 표준편차 0.18)는 청년패널 신입 디자이너 첫 월급의 분포(25% 200만, 중앙 225만, 95% 300만 원)에 맞춘 값입니다.</li>
      <li>다른 직업으로 옮겨도 바로 끝나지 않습니다. 해마다 디자이너로 돌아올 수 있고(노동패널: 떠난 첫해 ${pct(RET.other_first.back, 1)} n=${RET.other_first.n}, 그 뒤 ${pct(RET.other_later.back, 1)} n=${RET.other_later.n}), ${AWAY_MAX}년 안에 돌아오지 않으면 기록을 마칩니다. ${AWAY_MAX}년과, 그동안 월급을 디자이너 곡선으로 두는 것은 설계상 가정입니다. 다른 일을 하다 쉬게 되는 경우(연 11%)는 넣지 않았습니다.</li>
      <li>일을 쉬던 사람의 복귀는 쉰 첫해(같은 일: 디자이너 ${pct(R.designer.reentry.back)} n=${R.designer.reentry.n}, 개발자 ${pct(R.developer.reentry.back)} n=${R.developer.reentry.n})와 그 뒤(${pct(RET.not_employed_later.back)}, n=${RET.not_employed_later.n})를 나눠 씁니다.</li>
    </ul></section>

/* 엔딩: 60세 이후 — 국민연금과 모은 현금으로 언제까지 버티나 */
function retireHtml(P) {
  const r = retireOf(P), age = endAge(P);
  const ua = (x) => x === Infinity ? "연금으로 충분" : x >= 100 ? "100세 넘게" : `${Math.floor(x)}세까지`, u = ua(r.until);
  return `<section class="stack" style="gap:8px"><div class="eyebrow">${age < RETIRE_AGE ? `${age}세에 멈췄지만, ` : ""}60세 이후</div>
    <div class="facts">
      <div><b class="num">${r.pen.m ? `월 ${won(r.pen.m)}만` : "없음"}</b><span>국민연금 예상(${PENSION.age}세부터, 가입 ${r.pen.n}년${r.pen.n < PENSION.min ? " · 10년 미만" : ""})</span></div>
      <div><b class="num">월 ${won(r.need)}만</b><span>적정 노후생활비 ${P.married ? "(부부 298만의 내 몫)" : "(개인)"}</span></div>
      <div><b class="num">${PENSION.age - RETIRE_AGE}년</b><span>60세부터 연금까지 월급도 연금도 없는 기간</span></div>
      <div><b class="num ${r.until !== Infinity && r.until < 80 ? "neg" : ""}">${u}</b><span>모은 현금으로 버티는 나이(집 제외, 이자 없음)</span></div>
      ${r.hp ? `<div><b class="num">${ua(r.hp.until)}</b><span>집으로 주택연금(월 ${won(r.hp.m)}만, 60세부터)을 받으면</span></div>
      <div><b class="num">${ua(r.down.until)}</b><span>집을 줄여 이사하면(${manwon(Math.max(0, r.down.freed))} 손에 쥠)</span></div>` : ""}
    </div>
    <p class="fine">국민연금은 2026년 개혁 뒤 소득대체율 43%로 단순 계산(A값 약 309만 원, 상한 637만 원, 오늘 돈 기준). 노후생활비는 국민연금연구원 국민노후보장패널 10차(2024). ${r.hp ? "주택연금은 한국주택금융공사 월지급금 예시표(2026.3.1 기준, 일반주택·종신·정액형, 60세)로, 남은 주택담보대출은 먼저 갚는다고 쳤다. 집 줄이기는 지금 집값의 60%짜리로 옮긴다는 가정." : "집이 있었다면 주택연금이나 집 줄이기로 더 버틸 수 있었다."}</p></section>`;
}

/* ── 시작 ── */
function boot(saved) {
  S = saved && saved.S ? saved.S : freshState();
  if (S.screen === "play" && S.player) { S.speed = 0; S.autoPick = false; }
  render();
}
window.claude?.hot?.snapshot?.(() => ({ S }));
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
